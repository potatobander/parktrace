　　第四章　数据安全保护义务

　　第五章　政务数据安全与开放

　　第六章　法律责任

　　第七章　附则

第一章　总则

　　第一条 为了规范数据处理活动，保障数据安全，促进数据开发利用，保护个人、组织的合法权益，维护国家主权、安全和发展利益，制定本法。

　　第二条 在中华人民共和国境内开展数据处理活动及其安全监管，适用本法。
　　在中华人民共和国境外开展数据处理活动，损害中华人民共和国国家安全、公共利益或者公民、组织合法权益的，依法追究法律责任。

　　第三条 本法所称数据，是指任何以电子或者其他方式对信息的记录。

　　数据处理，包括数据的收集、存储、使用、加工、传输、提供、公开等。

　　数据安全，是指通过采取必要措施，确保数据处于有效保护和合法利用的状态，以及具备保障持续安全状态的能力。

　　第四条 维护数据安全，应当坚持总体国家安全观，建立健全数据安全治理体系，提高数据安全保障能力。

　　第五条 中央国家安全领导机构负责国家数据安全工作的决策和议事协调，研究制定、指导实施国家数据安全战略和有关重大方针政策，统筹协调国家数据安全的重大事项和重要工作，建立国家数据安全工作协调机制。

　　第六条 各地区、各部门对本地区、本部门工作中收集和产生的数据及数据安全负责。

　　工业、电信、交通、金融、自然资源、卫生健康、教育、科技等主管部门承担本行业、本领域数据安全监管职责。

　　公安机关、国家安全机关等依照本法和有关法律、行政法规的规定，在各自职责范围内承担数据安全监管职责。
　　国家网信部门依照本法和有关法律、行政法规的规定，负责统筹协调网络数据安全和相关监管工作。

　　第七条 国家保护个人、组织与数据有关的权益，鼓励数据依法合理有效利用，保障数据依法有序自由流动，促进以数据为关键要素的数字经济发展。

　　第八条 开展数据处理活动，应当遵守法律、法规，尊重社会公德和伦理，遵守商业道德和职业道德，诚实守信，履行数据安全保护义务，承担社会责任，不得危害国家安全、公共利益，不得损害个人、组织的合法权益。

　　第九条 国家支持开展数据安全知识宣传普及，提高全社会的数据安全保护意识和水平，推动有关部门、行业组织、科研机构、企业、个人等共同参与数据安全保护工作，形成全社会共同维护数据安全和促进发展的良好环境。

　　第十条 相关行业组织按照章程，依法制定数据安全行为规范和团体标准，加强行业自律，指导会员加强数据安全保护，提高数据安全保护水平，促进行业健康发展。

　　第十一条 国家积极开展数据安全治理、数据开发利用等领域的国际交流与合作，参与数据安全相关国际规则和标准的制定，促进数据跨境安全、自由流动。
　　第十二条 任何个人、组织都有权对违反本法规定的行为向有关主管部门投诉、举报。收到投诉、举报的部门应当及时依法处理。

　　有关主管部门应当对投诉、举报人的相关信息予以保密，保护投诉、举报人的合法权益。

第二章　数据安全与发展

　　第十三条 国家统筹发展和安全，坚持以数据开发利用和产业发展促进数据安全，以数据安全保障数据开发利用和产业发展。

　　第十四条 国家实施大数据战略，推进数据基础设施建设，鼓励和支持数据在各行业、各领域的创新应用。

　　省级以上人民政府应当将数字经济发展纳入本级国民经济和社会发展规划，并根据需要制定数字经济发展规划。

　　第十五条 国家支持开发利用数据提升公共服务的智能化水平。提供智能化公共服务，应当充分考虑老年人、残疾人的需求，避免对老年人、残疾人的日常生活造成障碍。

　　第十六条 国家支持数据开发利用和数据安全技术研究，鼓励数据开发利用和数据安全等领域的技术推广和商业创新，培育、发展数据开发利用和数据安全产品、产业体系。
　　第十七条 国家推进数据开发利用技术和数据安全标准体系建设。国务院标准化行政主管部门和国务院有关部门根据各自的职责，组织制定并适时修订有关数据开发利用技术、产品和数据安全相关标准。国家支持企业、社会团体和教育、科研机构等参与标准制定。

　　第十八条 国家促进数据安全检测评估、认证等服务的发展，支持数据安全检测评估、认证等专业机构依法开展服务活动。

　　国家支持有关部门、行业组织、企业、教育和科研机构、有关专业机构等在数据安全风险评估、防范、处置等方面开展协作。

　　第十九条 国家建立健全数据交易管理制度，规范数据交易行为，培育数据交易市场。

　　第二十条 国家支持教育、科研机构和企业等开展数据开发利用技术和数据安全相关教育和培训，采取多种方式培养数据开发利用技术和数据安全专业人才，促进人才交流。

第三章　数据安全制度
　　第二十一条 国家建立数据分类分级保护制度，根据数据在经济社会发展中的重要程度，以及一旦遭到篡改、破坏、泄露或者非法获取、非法利用，对国家安全、公共利益或者个人、组织合法权益造成的危害程度，对数据实行分类分级保护。国家数据安全工作协调机制统筹协调有关部门制定重要数据目录，加强对重要数据的保护。

　　关系国家安全、国民经济命脉、重要民生、重大公共利益等数据属于国家核心数据，实行更加严格的管理制度。

　　各地区、各部门应当按照数据分类分级保护制度，确定本地区、本部门以及相关行业、领域的重要数据具体目录，对列入目录的数据进行重点保护。

　　第二十二条 国家建立集中统一、高效权威的数据安全风险评估、报告、信息共享、监测预警机制。国家数据安全工作协调机制统筹协调有关部门加强数据安全风险信息的获取、分析、研判、预警工作。

　　第二十三条 国家建立数据安全应急处置机制。发生数据安全事件，有关主管部门应当依法启动应急预案，采取相应的应急处置措施，防止危害扩大，消除安全隐患，并及时向社会发布与公众有关的警示信息。
　　第二十四条 国家建立数据安全审查制度，对影响或者可能影响国家安全的数据处理活动进行国家安全审查。

　　依法作出的安全审查决定为最终决定。

　　第二十五条 国家对与维护国家安全和利益、履行国际义务相关的属于管制物项的数据依法实施出口管制。

　　第二十六条 任何国家或者地区在与数据和数据开发利用技术等有关的投资、贸易等方面对中华人民共和国采取歧视性的禁止、限制或者其他类似措施的，中华人民共和国可以根据实际情况对该国家或者地区对等采取措施。

第四章　数据安全保护义务

　　第二十七条 开展数据处理活动应当依照法律、法规的规定，建立健全全流程数据安全管理制度，组织开展数据安全教育培训，采取相应的技术措施和其他必要措施，保障数据安全。利用互联网等信息网络开展数据处理活动，应当在网络安全等级保护制度的基础上，履行上述数据安全保护义务。

　　重要数据的处理者应当明确数据安全负责人和管理机构，落实数据安全保护责任。

　　第二十八条 开展数据处理活动以及研究开发数据新技术，应当有利于促进经济社会发展，增进人民福祉，符合社会公德和伦理。
　　第二十九条 开展数据处理活动应当加强风险监测，发现数据安全缺陷、漏洞等风险时，应当立即采取补救措施；发生数据安全事件时，应当立即采取处置措施，按照规定及时告知用户并向有关主管部门报告。

　　第三十条 重要数据的处理者应当按照规定对其数据处理活动定期开展风险评估，并向有关主管部门报送风险评估报告。

　　风险评估报告应当包括处理的重要数据的种类、数量，开展数据处理活动的情况，面临的数据安全风险及其应对措施等。

　　第三十一条 关键信息基础设施的运营者在中华人民共和国境内运营中收集和产生的重要数据的出境安全管理，适用《中华人民共和国网络安全法》的规定；其他数据处理者在中华人民共和国境内运营中收集和产生的重要数据的出境安全管理办法，由国家网信部门会同国务院有关部门制定。

　　第三十二条 任何组织、个人收集数据，应当采取合法、正当的方式，不得窃取或者以其他非法方式获取数据。

　　法律、行政法规对收集、使用数据的目的、范围有规定的，应当在法律、行政法规规定的目的和范围内收集、使用数据。
　　第三十三条 从事数据交易中介服务的机构提供服务，应当要求数据提供方说明数据来源，审核交易双方的身份，并留存审核、交易记录。

　　第三十四条 法律、行政法规规定提供数据处理相关服务应当取得行政许可的，服务提供者应当依法取得许可。

　　第三十五条 公安机关、国家安全机关因依法维护国家安全或者侦查犯罪的需要调取数据，应当按照国家有关规定，经过严格的批准手续，依法进行，有关组织、个人应当予以配合。

　　第三十六条 中华人民共和国主管机关根据有关法律和中华人民共和国缔结或者参加的国际条约、协定，或者按照平等互惠原则，处理外国司法或者执法机构关于提供数据的请求。非经中华人民共和国主管机关批准，境内的组织、个人不得向外国司法或者执法机构提供存储于中华人民共和国境内的数据。

第五章　政务数据安全与开放

　　第三十七条 国家大力推进电子政务建设，提高政务数据的科学性、准确性、时效性，提升运用数据服务经济社会发展的能力。
　　第三十八条 国家机关为履行法定职责的需要收集、使用数据，应当在其履行法定职责的范围内依照法律、行政法规规定的条件和程序进行；对在履行职责中知悉的个人隐私、个人信息、商业秘密、保密商务信息等数据应当依法予以保密，不得泄露或者非法向他人提供。

　　第三十九条 国家机关应当依照法律、行政法规的规定，建立健全数据安全管理制度，落实数据安全保护责任，保障政务数据安全。

　　第四十条 国家机关委托他人建设、维护电子政务系统，存储、加工政务数据，应当经过严格的批准程序，并应当监督受托方履行相应的数据安全保护义务。受托方应当依照法律、法规的规定和合同约定履行数据安全保护义务，不得擅自留存、使用、泄露或者向他人提供政务数据。

　　第四十一条 国家机关应当遵循公正、公平、便民的原则，按照规定及时、准确地公开政务数据。依法不予公开的除外。

　　第四十二条 国家制定政务数据开放目录，构建统一规范、互联互通、安全可控的政务数据开放平台，推动政务数据开放利用。

　　第四十三条 法律、法规授权的具有管理公共事务职能的组织为履行法定职责开展数据处理活动，适用本章规定。

第六章　法律责任
　　第四十四条 有关主管部门在履行数据安全监管职责中，发现数据处理活动存在较大安全风险的，可以按照规定的权限和程序对有关组织、个人进行约谈，并要求有关组织、个人采取措施进行整改，消除隐患。

　　第四十五条 开展数据处理活动的组织、个人不履行本法第二十七条、第二十九条、第三十条规定的数据安全保护义务的，由有关主管部门责令改正，给予警告，可以并处五万元以上五十万元以下罚款，对直接负责的主管人员和其他直接责任人员可以处一万元以上十万元以下罚款；拒不改正或者造成大量数据泄露等严重后果的，处五十万元以上二百万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处五万元以上二十万元以下罚款。

　　违反国家核心数据管理制度，危害国家主权、安全和发展利益的，由有关主管部门处二百万元以上一千万元以下罚款，并根据情况责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照；构成犯罪的，依法追究刑事责任。
　　第四十六条 违反本法第三十一条规定，向境外提供重要数据的，由有关主管部门责令改正，给予警告，可以并处十万元以上一百万元以下罚款，对直接负责的主管人员和其他直接责任人员可以处一万元以上十万元以下罚款；情节严重的，处一百万元以上一千万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处十万元以上一百万元以下罚款。

　　第四十七条 从事数据交易中介服务的机构未履行本法第三十三条规定的义务的，由有关主管部门责令改正，没收违法所得，处违法所得一倍以上十倍以下罚款，没有违法所得或者违法所得不足十万元的，处十万元以上一百万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照；对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。

　　第四十八条 违反本法第三十五条规定，拒不配合数据调取的，由有关主管部门责令改正，给予警告，并处五万元以上五十万元以下罚款，对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。
　　违反本法第三十六条规定，未经主管机关批准向外国司法或者执法机构提供数据的，由有关主管部门给予警告，可以并处十万元以上一百万元以下罚款，对直接负责的主管人员和其他直接责任人员可以处一万元以上十万元以下罚款；造成严重后果的，处一百万元以上五百万元以下罚款，并可以责令暂停相关业务、停业整顿、吊销相关业务许可证或者吊销营业执照，对直接负责的主管人员和其他直接责任人员处五万元以上五十万元以下罚款。

　　第四十九条 国家机关不履行本法规定的数据安全保护义务的，对直接负责的主管人员和其他直接责任人员依法给予处分。

　　第五十条 履行数据安全监管职责的国家工作人员玩忽职守、滥用职权、徇私舞弊的，依法给予处分。

　　第五十一条 窃取或者以其他非法方式获取数据，开展数据处理活动排除、限制竞争，或者损害个人、组织合法权益的，依照有关法律、行政法规的规定处罚。

　　第五十二条 违反本法规定，给他人造成损害的，依法承担民事责任。

　　违反本法规定，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。

第七章　附则
　　第五十三条 开展涉及国家秘密的数据处理活动，适用《中华人民共和国保守国家秘密法》等法律、行政法规的规定。

　　在统计、档案工作中开展数据处理活动，开展涉及个人信息的数据处理活动，还应当遵守有关法律、行政法规的规定。

　　第五十四条 军事数据安全保护的办法，由中央军事委员会依据本法另行制定。

　　第五十五条 本法自2021年9月1日起施行。`,"law-personal":`中华人民共和国个人信息保护法

第一章　总　　则

第一条　为了保护个人信息权益，规范个人信息处理活动，促进个人信息合理利用，根据宪法，制定本法。

第二条　自然人的个人信息受法律保护，任何组织、个人不得侵害自然人的个人信息权益。

第三条　在中华人民共和国境内处理自然人个人信息的活动，适用本法。

在中华人民共和国境外处理中华人民共和国境内自然人个人信息的活动，有下列情形之一的，也适用本法：

（一）以向境内自然人提供产品或者服务为目的；
（二）分析、评估境内自然人的行为；

（三）法律、行政法规规定的其他情形。

第四条　个人信息是以电子或者其他方式记录的与已识别或者可识别的自然人有关的各种信息，不包括匿名化处理后的信息。

个人信息的处理包括个人信息的收集、存储、使用、加工、传输、提供、公开、删除等。

第五条　处理个人信息应当遵循合法、正当、必要和诚信原则，不得通过误导、欺诈、胁迫等方式处理个人信息。

第六条　处理个人信息应当具有明确、合理的目的，并应当与处理目的直接相关，采取对个人权益影响最小的方式。

收集个人信息，应当限于实现处理目的的最小范围，不得过度收集个人信息。

第七条　处理个人信息应当遵循公开、透明原则，公开个人信息处理规则，明示处理的目的、方式和范围。

第八条　处理个人信息应当保证个人信息的质量，避免因个人信息不准确、不完整对个人权益造成不利影响。

第九条　个人信息处理者应当对其个人信息处理活动负责，并采取必要措施保障所处理的个人信息的安全。

第十条　任何组织、个人不得非法收集、使用、加工、传输他人个人信息，不得非法买卖、提供或者公开他人个人信息；不得从事危害国家安全、公共利益的个人信息处理活动。
第十一条　国家建立健全个人信息保护制度，预防和惩治侵害个人信息权益的行为，加强个人信息保护宣传教育，推动形成政府、企业、相关社会组织、公众共同参与个人信息保护的良好环境。

第十二条　国家积极参与个人信息保护国际规则的制定，促进个人信息保护方面的国际交流与合作，推动与其他国家、地区、国际组织之间的个人信息保护规则、标准等互认。

第二章　个人信息处理规则

第一节　一般规定

第十三条　符合下列情形之一的，个人信息处理者方可处理个人信息：

（一）取得个人的同意；

（二）为订立、履行个人作为一方当事人的合同所必需，或者按照依法制定的劳动规章制度和依法签订的集体合同实施人力资源管理所必需；

（三）为履行法定职责或者法定义务所必需；

（四）为应对突发公共卫生事件，或者紧急情况下为保护自然人的生命健康和财产安全所必需；

（五）为公共利益实施新闻报道、舆论监督等行为，在合理的范围内处理个人信息；

（六）依照本法规定在合理的范围内处理个人自行公开或者其他已经合法公开的个人信息；

（七）法律、行政法规规定的其他情形。
依照本法其他有关规定，处理个人信息应当取得个人同意，但是有前款第二项至第七项规定情形的，不需取得个人同意。

第十四条　基于个人同意处理个人信息的，该同意应当由个人在充分知情的前提下自愿、明确作出。法律、行政法规规定处理个人信息应当取得个人单独同意或者书面同意的，从其规定。

个人信息的处理目的、处理方式和处理的个人信息种类发生变更的，应当重新取得个人同意。

第十五条　基于个人同意处理个人信息的，个人有权撤回其同意。个人信息处理者应当提供便捷的撤回同意的方式。

个人撤回同意，不影响撤回前基于个人同意已进行的个人信息处理活动的效力。

第十六条　个人信息处理者不得以个人不同意处理其个人信息或者撤回同意为由，拒绝提供产品或者服务；处理个人信息属于提供产品或者服务所必需的除外。

第十七条　个人信息处理者在处理个人信息前，应当以显著方式、清晰易懂的语言真实、准确、完整地向个人告知下列事项：

（一）个人信息处理者的名称或者姓名和联系方式；

（二）个人信息的处理目的、处理方式，处理的个人信息种类、保存期限；

（三）个人行使本法规定权利的方式和程序；

（四）法律、行政法规规定应当告知的其他事项。
前款规定事项发生变更的，应当将变更部分告知个人。

个人信息处理者通过制定个人信息处理规则的方式告知第一款规定事项的，处理规则应当公开，并且便于查阅和保存。

第十八条　个人信息处理者处理个人信息，有法律、行政法规规定应当保密或者不需要告知的情形的，可以不向个人告知前条第一款规定的事项。

紧急情况下为保护自然人的生命健康和财产安全无法及时向个人告知的，个人信息处理者应当在紧急情况消除后及时告知。

第十九条　除法律、行政法规另有规定外，个人信息的保存期限应当为实现处理目的所必要的最短时间。

第二十条　两个以上的个人信息处理者共同决定个人信息的处理目的和处理方式的，应当约定各自的权利和义务。但是，该约定不影响个人向其中任何一个个人信息处理者要求行使本法规定的权利。

个人信息处理者共同处理个人信息，侵害个人信息权益造成损害的，应当依法承担连带责任。

第二十一条　个人信息处理者委托处理个人信息的，应当与受托人约定委托处理的目的、期限、处理方式、个人信息的种类、保护措施以及双方的权利和义务等，并对受托人的个人信息处理活动进行监督。
受托人应当按照约定处理个人信息，不得超出约定的处理目的、处理方式等处理个人信息；委托合同不生效、无效、被撤销或者终止的，受托人应当将个人信息返还个人信息处理者或者予以删除，不得保留。

未经个人信息处理者同意，受托人不得转委托他人处理个人信息。

第二十二条　个人信息处理者因合并、分立、解散、被宣告破产等原因需要转移个人信息的，应当向个人告知接收方的名称或者姓名和联系方式。接收方应当继续履行个人信息处理者的义务。接收方变更原先的处理目的、处理方式的，应当依照本法规定重新取得个人同意。

第二十三条　个人信息处理者向其他个人信息处理者提供其处理的个人信息的，应当向个人告知接收方的名称或者姓名、联系方式、处理目的、处理方式和个人信息的种类，并取得个人的单独同意。接收方应当在上述处理目的、处理方式和个人信息的种类等范围内处理个人信息。接收方变更原先的处理目的、处理方式的，应当依照本法规定重新取得个人同意。

第二十四条　个人信息处理者利用个人信息进行自动化决策，应当保证决策的透明度和结果公平、公正，不得对个人在交易价格等交易条件上实行不合理的差别待遇。
通过自动化决策方式向个人进行信息推送、商业营销，应当同时提供不针对其个人特征的选项，或者向个人提供便捷的拒绝方式。

通过自动化决策方式作出对个人权益有重大影响的决定，个人有权要求个人信息处理者予以说明，并有权拒绝个人信息处理者仅通过自动化决策的方式作出决定。

第二十五条　个人信息处理者不得公开其处理的个人信息，取得个人单独同意的除外。

第二十六条　在公共场所安装图像采集、个人身份识别设备，应当为维护公共安全所必需，遵守国家有关规定，并设置显著的提示标识。所收集的个人图像、身份识别信息只能用于维护公共安全的目的，不得用于其他目的；取得个人单独同意的除外。

第二十七条　个人信息处理者可以在合理的范围内处理个人自行公开或者其他已经合法公开的个人信息；个人明确拒绝的除外。个人信息处理者处理已公开的个人信息，对个人权益有重大影响的，应当依照本法规定取得个人同意。

第二节  敏感个人信息的处理规则
第二十八条　敏感个人信息是一旦泄露或者非法使用，容易导致自然人的人格尊严受到侵害或者人身、财产安全受到危害的个人信息，包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息，以及不满十四周岁未成年人的个人信息。

只有在具有特定的目的和充分的必要性，并采取严格保护措施的情形下，个人信息处理者方可处理敏感个人信息。

第二十九条　处理敏感个人信息应当取得个人的单独同意；法律、行政法规规定处理敏感个人信息应当取得书面同意的，从其规定。

第三十条　个人信息处理者处理敏感个人信息的，除本法第十七条第一款规定的事项外，还应当向个人告知处理敏感个人信息的必要性以及对个人权益的影响；依照本法规定可以不向个人告知的除外。

第三十一条　个人信息处理者处理不满十四周岁未成年人个人信息的，应当取得未成年人的父母或者其他监护人的同意。

个人信息处理者处理不满十四周岁未成年人个人信息的，应当制定专门的个人信息处理规则。

第三十二条　法律、行政法规对处理敏感个人信息规定应当取得相关行政许可或者作出其他限制的，从其规定。

第三节　国家机关处理个人信息的特别规定
第三十三条　国家机关处理个人信息的活动，适用本法；本节有特别规定的，适用本节规定。

第三十四条　国家机关为履行法定职责处理个人信息，应当依照法律、行政法规规定的权限、程序进行，不得超出履行法定职责所必需的范围和限度。

第三十五条　国家机关为履行法定职责处理个人信息，应当依照本法规定履行告知义务；有本法第十八条第一款规定的情形，或者告知将妨碍国家机关履行法定职责的除外。

第三十六条　国家机关处理的个人信息应当在中华人民共和国境内存储；确需向境外提供的，应当进行安全评估。安全评估可以要求有关部门提供支持与协助。

第三十七条　法律、法规授权的具有管理公共事务职能的组织为履行法定职责处理个人信息，适用本法关于国家机关处理个人信息的规定。

第三章　个人信息跨境提供的规则

第三十八条　个人信息处理者因业务等需要，确需向中华人民共和国境外提供个人信息的，应当具备下列条件之一：

（一）依照本法第四十条的规定通过国家网信部门组织的安全评估；

（二）按照国家网信部门的规定经专业机构进行个人信息保护认证；

（三）按照国家网信部门制定的标准合同与境外接收方订立合同，约定双方的权利和义务；
（四）法律、行政法规或者国家网信部门规定的其他条件。

中华人民共和国缔结或者参加的国际条约、协定对向中华人民共和国境外提供个人信息的条件等有规定的，可以按照其规定执行。

个人信息处理者应当采取必要措施，保障境外接收方处理个人信息的活动达到本法规定的个人信息保护标准。

第三十九条　个人信息处理者向中华人民共和国境外提供个人信息的，应当向个人告知境外接收方的名称或者姓名、联系方式、处理目的、处理方式、个人信息的种类以及个人向境外接收方行使本法规定权利的方式和程序等事项，并取得个人的单独同意。

第四十条　关键信息基础设施运营者和处理个人信息达到国家网信部门规定数量的个人信息处理者，应当将在中华人民共和国境内收集和产生的个人信息存储在境内。确需向境外提供的，应当通过国家网信部门组织的安全评估；法律、行政法规和国家网信部门规定可以不进行安全评估的，从其规定。
第四十一条　中华人民共和国主管机关根据有关法律和中华人民共和国缔结或者参加的国际条约、协定，或者按照平等互惠原则，处理外国司法或者执法机构关于提供存储于境内个人信息的请求。非经中华人民共和国主管机关批准，个人信息处理者不得向外国司法或者执法机构提供存储于中华人民共和国境内的个人信息。

第四十二条　境外的组织、个人从事侵害中华人民共和国公民的个人信息权益，或者危害中华人民共和国国家安全、公共利益的个人信息处理活动的，国家网信部门可以将其列入限制或者禁止个人信息提供清单，予以公告，并采取限制或者禁止向其提供个人信息等措施。

第四十三条　任何国家或者地区在个人信息保护方面对中华人民共和国采取歧视性的禁止、限制或者其他类似措施的，中华人民共和国可以根据实际情况对该国家或者地区对等采取措施。

第四章　个人在个人信息处理活动中的权利

第四十四条　个人对其个人信息的处理享有知情权、决定权，有权限制或者拒绝他人对其个人信息进行处理；法律、行政法规另有规定的除外。

第四十五条　个人有权向个人信息处理者查阅、复制其个人信息；有本法第十八条第一款、第三十五条规定情形的除外。
个人请求查阅、复制其个人信息的，个人信息处理者应当及时提供。

个人请求将个人信息转移至其指定的个人信息处理者，符合国家网信部门规定条件的，个人信息处理者应当提供转移的途径。

第四十六条　个人发现其个人信息不准确或者不完整的，有权请求个人信息处理者更正、补充。

个人请求更正、补充其个人信息的，个人信息处理者应当对其个人信息予以核实，并及时更正、补充。

第四十七条　有下列情形之一的，个人信息处理者应当主动删除个人信息；个人信息处理者未删除的，个人有权请求删除：

（一）处理目的已实现、无法实现或者为实现处理目的不再必要；

（二）个人信息处理者停止提供产品或者服务，或者保存期限已届满；

（三）个人撤回同意；

（四）个人信息处理者违反法律、行政法规或者违反约定处理个人信息；

（五）法律、行政法规规定的其他情形。

法律、行政法规规定的保存期限未届满，或者删除个人信息从技术上难以实现的，个人信息处理者应当停止除存储和采取必要的安全保护措施之外的处理。

第四十八条　个人有权要求个人信息处理者对其个人信息处理规则进行解释说明。
第四十九条　自然人死亡的，其近亲属为了自身的合法、正当利益，可以对死者的相关个人信息行使本章规定的查阅、复制、更正、删除等权利；死者生前另有安排的除外。

第五十条　个人信息处理者应当建立便捷的个人行使权利的申请受理和处理机制。拒绝个人行使权利的请求的，应当说明理由。

个人信息处理者拒绝个人行使权利的请求的，个人可以依法向人民法院提起诉讼。

第五章　个人信息处理者的义务

第五十一条　个人信息处理者应当根据个人信息的处理目的、处理方式、个人信息的种类以及对个人权益的影响、可能存在的安全风险等，采取下列措施确保个人信息处理活动符合法律、行政法规的规定，并防止未经授权的访问以及个人信息泄露、篡改、丢失：

（一）制定内部管理制度和操作规程；

（二）对个人信息实行分类管理；

（三）采取相应的加密、去标识化等安全技术措施；

（四）合理确定个人信息处理的操作权限，并定期对从业人员进行安全教育和培训；

（五）制定并组织实施个人信息安全事件应急预案；

（六）法律、行政法规规定的其他措施。
第五十二条　处理个人信息达到国家网信部门规定数量的个人信息处理者应当指定个人信息保护负责人，负责对个人信息处理活动以及采取的保护措施等进行监督。

个人信息处理者应当公开个人信息保护负责人的联系方式，并将个人信息保护负责人的姓名、联系方式等报送履行个人信息保护职责的部门。

第五十三条　本法第三条第二款规定的中华人民共和国境外的个人信息处理者，应当在中华人民共和国境内设立专门机构或者指定代表，负责处理个人信息保护相关事务，并将有关机构的名称或者代表的姓名、联系方式等报送履行个人信息保护职责的部门。

第五十四条　个人信息处理者应当定期对其处理个人信息遵守法律、行政法规的情况进行合规审计。

第五十五条　有下列情形之一的，个人信息处理者应当事前进行个人信息保护影响评估，并对处理情况进行记录：

（一）处理敏感个人信息；

（二）利用个人信息进行自动化决策；

（三）委托处理个人信息、向其他个人信息处理者提供个人信息、公开个人信息；

（四）向境外提供个人信息；

（五）其他对个人权益有重大影响的个人信息处理活动。

第五十六条　个人信息保护影响评估应当包括下列内容：
（一）个人信息的处理目的、处理方式等是否合法、正当、必要；

（二）对个人权益的影响及安全风险；

（三）所采取的保护措施是否合法、有效并与风险程度相适应。

个人信息保护影响评估报告和处理情况记录应当至少保存三年。

第五十七条　发生或者可能发生个人信息泄露、篡改、丢失的，个人信息处理者应当立即采取补救措施，并通知履行个人信息保护职责的部门和个人。通知应当包括下列事项：

（一）发生或者可能发生个人信息泄露、篡改、丢失的信息种类、原因和可能造成的危害；

（二）个人信息处理者采取的补救措施和个人可以采取的减轻危害的措施；

（三）个人信息处理者的联系方式。

个人信息处理者采取措施能够有效避免信息泄露、篡改、丢失造成危害的，个人信息处理者可以不通知个人；履行个人信息保护职责的部门认为可能造成危害的，有权要求个人信息处理者通知个人。

第五十八条　提供重要互联网平台服务、用户数量巨大、业务类型复杂的个人信息处理者，应当履行下列义务：

（一）按照国家规定建立健全个人信息保护合规制度体系，成立主要由外部成员组成的独立机构对个人信息保护情况进行监督；
（二）遵循公开、公平、公正的原则，制定平台规则，明确平台内产品或者服务提供者处理个人信息的规范和保护个人信息的义务；

（三）对严重违反法律、行政法规处理个人信息的平台内的产品或者服务提供者，停止提供服务；

（四）定期发布个人信息保护社会责任报告，接受社会监督。

第五十九条　接受委托处理个人信息的受托人，应当依照本法和有关法律、行政法规的规定，采取必要措施保障所处理的个人信息的安全，并协助个人信息处理者履行本法规定的义务。

第六章　履行个人信息保护职责的部门

第六十条　国家网信部门负责统筹协调个人信息保护工作和相关监督管理工作。国务院有关部门依照本法和有关法律、行政法规的规定，在各自职责范围内负责个人信息保护和监督管理工作。

县级以上地方人民政府有关部门的个人信息保护和监督管理职责，按照国家有关规定确定。

前两款规定的部门统称为履行个人信息保护职责的部门。

第六十一条　履行个人信息保护职责的部门履行下列个人信息保护职责：

（一）开展个人信息保护宣传教育，指导、监督个人信息处理者开展个人信息保护工作；

（二）接受、处理与个人信息保护有关的投诉、举报；
（三）组织对应用程序等个人信息保护情况进行测评，并公布测评结果；

（四）调查、处理违法个人信息处理活动；

（五）法律、行政法规规定的其他职责。

第六十二条　国家网信部门统筹协调有关部门依据本法推进下列个人信息保护工作：

（一）制定个人信息保护具体规则、标准；

（二）针对小型个人信息处理者、处理敏感个人信息以及人脸识别、人工智能等新技术、新应用，制定专门的个人信息保护规则、标准；

（三）支持研究开发和推广应用安全、方便的电子身份认证技术，推进网络身份认证公共服务建设；

（四）推进个人信息保护社会化服务体系建设，支持有关机构开展个人信息保护评估、认证服务；

（五）完善个人信息保护投诉、举报工作机制。

第六十三条　履行个人信息保护职责的部门履行个人信息保护职责，可以采取下列措施：

（一）询问有关当事人，调查与个人信息处理活动有关的情况；

（二）查阅、复制当事人与个人信息处理活动有关的合同、记录、账簿以及其他有关资料；

（三）实施现场检查，对涉嫌违法的个人信息处理活动进行调查；
（四）检查与个人信息处理活动有关的设备、物品；对有证据证明是用于违法个人信息处理活动的设备、物品，向本部门主要负责人书面报告并经批准，可以查封或者扣押。

履行个人信息保护职责的部门依法履行职责，当事人应当予以协助、配合，不得拒绝、阻挠。

第六十四条　履行个人信息保护职责的部门在履行职责中，发现个人信息处理活动存在较大风险或者发生个人信息安全事件的，可以按照规定的权限和程序对该个人信息处理者的法定代表人或者主要负责人进行约谈，或者要求个人信息处理者委托专业机构对其个人信息处理活动进行合规审计。个人信息处理者应当按照要求采取措施，进行整改，消除隐患。

履行个人信息保护职责的部门在履行职责中，发现违法处理个人信息涉嫌犯罪的，应当及时移送公安机关依法处理。

第六十五条　任何组织、个人有权对违法个人信息处理活动向履行个人信息保护职责的部门进行投诉、举报。收到投诉、举报的部门应当依法及时处理，并将处理结果告知投诉、举报人。

履行个人信息保护职责的部门应当公布接受投诉、举报的联系方式。

第七章　法律责任
第六十六条　违反本法规定处理个人信息，或者处理个人信息未履行本法规定的个人信息保护义务的，由履行个人信息保护职责的部门责令改正，给予警告，没收违法所得，对违法处理个人信息的应用程序，责令暂停或者终止提供服务；拒不改正的，并处一百万元以下罚款；对直接负责的主管人员和其他直接责任人员处一万元以上十万元以下罚款。

有前款规定的违法行为，情节严重的，由省级以上履行个人信息保护职责的部门责令改正，没收违法所得，并处五千万元以下或者上一年度营业额百分之五以下罚款，并可以责令暂停相关业务或者停业整顿、通报有关主管部门吊销相关业务许可或者吊销营业执照；对直接负责的主管人员和其他直接责任人员处十万元以上一百万元以下罚款，并可以决定禁止其在一定期限内担任相关企业的董事、监事、高级管理人员和个人信息保护负责人。

第六十七条　有本法规定的违法行为的，依照有关法律、行政法规的规定记入信用档案，并予以公示。

第六十八条　国家机关不履行本法规定的个人信息保护义务的，由其上级机关或者履行个人信息保护职责的部门责令改正；对直接负责的主管人员和其他直接责任人员依法给予处分。
履行个人信息保护职责的部门的工作人员玩忽职守、滥用职权、徇私舞弊，尚不构成犯罪的，依法给予处分。

第六十九条　处理个人信息侵害个人信息权益造成损害，个人信息处理者不能证明自己没有过错的，应当承担损害赔偿等侵权责任。

前款规定的损害赔偿责任按照个人因此受到的损失或者个人信息处理者因此获得的利益确定；个人因此受到的损失和个人信息处理者因此获得的利益难以确定的，根据实际情况确定赔偿数额。

第七十条　个人信息处理者违反本法规定处理个人信息，侵害众多个人的权益的，人民检察院、法律规定的消费者组织和由国家网信部门确定的组织可以依法向人民法院提起诉讼。

第七十一条　违反本法规定，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。

第八章　附　　则

第七十二条　自然人因个人或者家庭事务处理个人信息的，不适用本法。

法律对各级人民政府及其有关部门组织实施的统计、档案管理活动中的个人信息处理有规定的，适用其规定。

第七十三条　本法下列用语的含义：

（一）个人信息处理者，是指在个人信息处理活动中自主决定处理目的、处理方式的组织、个人。
（二）自动化决策，是指通过计算机程序自动分析、评估个人的行为习惯、兴趣爱好或者经济、健康、信用状况等，并进行决策的活动。

（三）去标识化，是指个人信息经过处理，使其在不借助额外信息的情况下无法识别特定自然人的过程。

（四）匿名化，是指个人信息经过处理无法识别特定自然人且不能复原的过程。

第七十四条　本法自2021年11月1日起施行。`,"policy-20":`中共中央 国务院关于构建数据基础制度更好发挥数据要素作用的意见

（2022年12月2日）

　　数据作为新型生产要素，是数字化、网络化、智能化的基础，已快速融入生产、分配、流通、消费和社会服务管理等各环节，深刻改变着生产方式、生活方式和社会治理方式。数据基础制度建设事关国家发展和安全大局。为加快构建数据基础制度，充分发挥我国海量数据规模和丰富应用场景优势，激活数据要素潜能，做强做优做大数字经济，增强经济发展新动能，构筑国家竞争新优势，现提出如下意见。

　　一、总体要求
　　（一）指导思想。以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大精神，完整、准确、全面贯彻新发展理念，加快构建新发展格局，坚持改革创新、系统谋划，以维护国家数据安全、保护个人信息和商业秘密为前提，以促进数据合规高效流通使用、赋能实体经济为主线，以数据产权、流通交易、收益分配、安全治理为重点，深入参与国际高标准数字规则制定，构建适应数据特征、符合数字经济发展规律、保障国家数据安全、彰显创新引领的数据基础制度，充分实现数据要素价值、促进全体人民共享数字经济发展红利，为深化创新驱动、推动高质量发展、推进国家治理体系和治理能力现代化提供有力支撑。

　　（二）工作原则

　　——遵循发展规律，创新制度安排。充分认识和把握数据产权、流通、交易、使用、分配、治理、安全等基本规律，探索有利于数据安全保护、有效利用、合规流通的产权制度和市场体系，完善数据要素市场体制机制，在实践中完善，在探索中发展，促进形成与数字生产力相适应的新型生产关系。
　　——坚持共享共用，释放价值红利。合理降低市场主体获取数据的门槛，增强数据要素共享性、普惠性，激励创新创业创造，强化反垄断和反不正当竞争，形成依法规范、共同参与、各取所需、共享红利的发展模式。

　　——强化优质供给，促进合规流通。顺应经济社会数字化转型发展趋势，推动数据要素供给调整优化，提高数据要素供给数量和质量。建立数据可信流通体系，增强数据的可用、可信、可流通、可追溯水平。实现数据流通全过程动态管理，在合规流通使用中激活数据价值。

　　——完善治理体系，保障安全发展。统筹发展和安全，贯彻总体国家安全观，强化数据安全保障体系建设，把安全贯穿数据供给、流通、使用全过程，划定监管底线和红线。加强数据分类分级管理，把该管的管住、该放的放开，积极有效防范和化解各种数据风险，形成政府监管与市场自律、法治与行业自治协同、国内与国际统筹的数据要素治理结构。

　　——深化开放合作，实现互利共赢。积极参与数据跨境流动国际规则制定，探索加入区域性国际数据跨境流动制度安排。推动数据跨境流动双边多边协商，推进建立互利互惠的规则等制度安排。鼓励探索数据跨境流动与合作的新途径新模式。
　　二、建立保障权益、合规使用的数据产权制度

　　探索建立数据产权制度，推动数据产权结构性分置和有序流通，结合数据要素特性强化高质量数据要素供给；在国家数据分类分级保护制度下，推进数据分类分级确权授权使用和市场化流通交易，健全数据要素权益保护制度，逐步形成具有中国特色的数据产权制度体系。

　　（三）探索数据产权结构性分置制度。建立公共数据、企业数据、个人数据的分类分级确权授权制度。根据数据来源和数据生成特征，分别界定数据生产、流通、使用过程中各参与方享有的合法权利，建立数据资源持有权、数据加工使用权、数据产品经营权等分置的产权运行机制，推进非公共数据按市场化方式“共同使用、共享收益”的新模式，为激活数据要素价值创造和价值实现提供基础性制度保障。研究数据产权登记新方式。在保障安全前提下，推动数据处理者依法依规对原始数据进行开发利用，支持数据处理者依法依规行使数据应用相关权利，促进数据使用价值复用与充分利用，促进数据使用权交换和市场化流通。审慎对待原始数据的流转交易行为。
　　（四）推进实施公共数据确权授权机制。对各级党政机关、企事业单位依法履职或提供公共服务过程中产生的公共数据，加强汇聚共享和开放开发，强化统筹授权使用和管理，推进互联互通，打破“数据孤岛”。鼓励公共数据在保护个人隐私和确保公共安全的前提下，按照“原始数据不出域、数据可用不可见”的要求，以模型、核验等产品和服务等形式向社会提供，对不承载个人信息和不影响公共安全的公共数据，推动按用途加大供给使用范围。推动用于公共治理、公益事业的公共数据有条件无偿使用，探索用于产业发展、行业发展的公共数据有条件有偿使用。依法依规予以保密的公共数据不予开放，严格管控未依法依规公开的原始公共数据直接进入市场，保障公共数据供给使用的公共利益。
　　（五）推动建立企业数据确权授权机制。对各类市场主体在生产经营活动中采集加工的不涉及个人信息和公共利益的数据，市场主体享有依法依规持有、使用、获取收益的权益，保障其投入的劳动和其他要素贡献获得合理回报，加强数据要素供给激励。鼓励探索企业数据授权使用新模式，发挥国有企业带头作用，引导行业龙头企业、互联网平台企业发挥带动作用，促进与中小微企业双向公平授权，共同合理使用数据，赋能中小微企业数字化转型。支持第三方机构、中介服务组织加强数据采集和质量评估标准制定，推动数据产品标准化，发展数据分析、数据服务等产业。政府部门履职可依法依规获取相关企业和机构数据，但须约定并严格遵守使用限制要求。
　　（六）建立健全个人信息数据确权授权机制。对承载个人信息的数据，推动数据处理者按照个人授权范围依法依规采集、持有、托管和使用数据，规范对个人信息的处理活动，不得采取“一揽子授权”、强制同意等方式过度收集个人信息，促进个人信息合理利用。探索由受托者代表个人利益，监督市场主体对个人信息数据进行采集、加工、使用的机制。对涉及国家安全的特殊个人信息数据，可依法依规授权有关单位使用。加大个人信息保护力度，推动重点行业建立完善长效保护机制，强化企业主体责任，规范企业采集使用个人信息行为。创新技术手段，推动个人信息匿名化处理，保障使用个人信息数据时的信息安全和个人隐私。
　　（七）建立健全数据要素各参与方合法权益保护制度。充分保护数据来源者合法权益，推动基于知情同意或存在法定事由的数据流通使用模式，保障数据来源者享有获取或复制转移由其促成产生数据的权益。合理保护数据处理者对依法依规持有的数据进行自主管控的权益。在保护公共利益、数据安全、数据来源者合法权益的前提下，承认和保护依照法律规定或合同约定获取的数据加工使用权，尊重数据采集、加工等数据处理者的劳动和其他要素贡献，充分保障数据处理者使用数据和获得收益的权利。保护经加工、分析等形成数据或数据衍生产品的经营权，依法依规规范数据处理者许可他人使用数据或数据衍生产品的权利，促进数据要素流通复用。建立健全基于法律规定或合同约定流转数据相关财产性权益的机制。在数据处理者发生合并、分立、解散、被宣告破产时，推动相关权利和义务依法依规同步转移。

　　三、建立合规高效、场内外结合的数据要素流通和交易制度

　　完善和规范数据流通规则，构建促进使用和流通、场内场外相结合的交易制度体系，规范引导场外交易，培育壮大场内交易；有序发展数据跨境流通和交易，建立数据来源可确认、使用范围可界定、流通过程可追溯、安全风险可防范的数据可信流通体系。
　　（八）完善数据全流程合规与监管规则体系。建立数据流通准入标准规则，强化市场主体数据全流程合规治理，确保流通数据来源合法、隐私保护到位、流通和交易规范。结合数据流通范围、影响程度、潜在风险，区分使用场景和用途用量，建立数据分类分级授权使用规范，探索开展数据质量标准化体系建设，加快推进数据采集和接口标准化，促进数据整合互通和互操作。支持数据处理者依法依规在场内和场外采取开放、共享、交换、交易等方式流通数据。鼓励探索数据流通安全保障技术、标准、方案。支持探索多样化、符合数据要素特性的定价模式和价格形成机制，推动用于数字化发展的公共数据按政府指导定价有偿使用，企业与个人信息数据市场自主定价。加强企业数据合规体系建设和监管，严厉打击黑市交易，取缔数据流通非法产业。建立实施数据安全管理认证制度，引导企业通过认证提升数据安全管理水平。
　　（九）统筹构建规范高效的数据交易场所。加强数据交易场所体系设计，统筹优化数据交易场所的规划布局，严控交易场所数量。出台数据交易场所管理办法，建立健全数据交易规则，制定全国统一的数据交易、安全等标准体系，降低交易成本。引导多种类型的数据交易场所共同发展，突出国家级数据交易场所合规监管和基础服务功能，强化其公共属性和公益定位，推进数据交易场所与数据商功能分离，鼓励各类数据商进场交易。规范各地区各部门设立的区域性数据交易场所和行业性数据交易平台，构建多层次市场交易体系，推动区域性、行业性数据流通使用。促进区域性数据交易场所和行业性数据交易平台与国家级数据交易场所互联互通。构建集约高效的数据流通基础设施，为场内集中交易和场外分散交易提供低成本、高效率、可信赖的流通环境。
　　（十）培育数据要素流通和交易服务生态。围绕促进数据要素合规高效、安全有序流通和交易需要，培育一批数据商和第三方专业服务机构。通过数据商，为数据交易双方提供数据产品开发、发布、承销和数据资产的合规化、标准化、增值化服务，促进提高数据交易效率。在智能制造、节能降碳、绿色建造、新能源、智慧城市等重点领域，大力培育贴近业务需求的行业性、产业化数据商，鼓励多种所有制数据商共同发展、平等竞争。有序培育数据集成、数据经纪、合规认证、安全审计、数据公证、数据保险、数据托管、资产评估、争议仲裁、风险评估、人才培训等第三方专业服务机构，提升数据流通和交易全流程服务能力。
　　（十一）构建数据安全合规有序跨境流通机制。开展数据交互、业务互通、监管互认、服务共享等方面国际交流合作，推进跨境数字贸易基础设施建设，以《全球数据安全倡议》为基础，积极参与数据流动、数据安全、认证评估、数字货币等国际规则和数字技术标准制定。坚持开放发展，推动数据跨境双向有序流动，鼓励国内外企业及组织依法依规开展数据跨境流动业务合作，支持外资依法依规进入开放领域，推动形成公平竞争的国际化市场。针对跨境电商、跨境支付、供应链管理、服务外包等典型应用场景，探索安全规范的数据跨境流动方式。统筹数据开发利用和数据安全保护，探索建立跨境数据分类分级管理机制。对影响或者可能影响国家安全的数据处理、数据跨境传输、外资并购等活动依法依规进行国家安全审查。按照对等原则，对维护国家安全和利益、履行国际义务相关的属于管制物项的数据依法依规实施出口管制，保障数据用于合法用途，防范数据出境安全风险。探索构建多渠道、便利化的数据跨境流动监管机制，健全多部门协调配合的数据跨境流动监管体系。反对数据霸权和数据保护主义，有效应对数据领域“长臂管辖”。

　　四、建立体现效率、促进公平的数据要素收益分配制度
　　顺应数字产业化、产业数字化发展趋势，充分发挥市场在资源配置中的决定性作用，更好发挥政府作用。完善数据要素市场化配置机制，扩大数据要素市场化配置范围和按价值贡献参与分配渠道。完善数据要素收益的再分配调节机制，让全体人民更好共享数字经济发展成果。

　　（十二）健全数据要素由市场评价贡献、按贡献决定报酬机制。结合数据要素特征，优化分配结构，构建公平、高效、激励与规范相结合的数据价值分配机制。坚持“两个毫不动摇”，按照“谁投入、谁贡献、谁受益”原则，着重保护数据要素各参与方的投入产出收益，依法依规维护数据资源资产权益，探索个人、企业、公共数据分享价值收益的方式，建立健全更加合理的市场评价机制，促进劳动者贡献和劳动报酬相匹配。推动数据要素收益向数据价值和使用价值的创造者合理倾斜，确保在开发挖掘数据价值各环节的投入有相应回报，强化基于数据价值创造和价值实现的激励导向。通过分红、提成等多种收益共享方式，平衡兼顾数据内容采集、加工、流通、应用等不同环节相关主体之间的利益分配。
　　（十三）更好发挥政府在数据要素收益分配中的引导调节作用。逐步建立保障公平的数据要素收益分配体制机制，更加关注公共利益和相对弱势群体。加大政府引导调节力度，探索建立公共数据资源开放收益合理分享机制，允许并鼓励各类企业依法依规依托公共数据提供公益服务。推动大型数据企业积极承担社会责任，强化对弱势群体的保障帮扶，有力有效应对数字化转型过程中的各类风险挑战。不断健全数据要素市场体系和制度规则，防止和依法依规规制资本在数据领域无序扩张形成市场垄断等问题。统筹使用多渠道资金资源，开展数据知识普及和教育培训，提高社会整体数字素养，着力消除不同区域间、人群间数字鸿沟，增进社会公平、保障民生福祉、促进共同富裕。

　　五、建立安全可控、弹性包容的数据要素治理制度

　　把安全贯穿数据治理全过程，构建政府、企业、社会多方协同的治理模式，创新政府治理方式，明确各方主体责任和义务，完善行业自律机制，规范市场发展秩序，形成有效市场和有为政府相结合的数据要素治理格局。
　　（十四）创新政府数据治理机制。充分发挥政府有序引导和规范发展的作用，守住安全底线，明确监管红线，打造安全可信、包容创新、公平开放、监管有效的数据要素市场环境。强化分行业监管和跨行业协同监管，建立数据联管联治机制，建立健全鼓励创新、包容创新的容错纠错机制。建立数据要素生产流通使用全过程的合规公证、安全审查、算法审查、监测预警等制度，指导各方履行数据要素流通安全责任和义务。建立健全数据流通监管制度，制定数据流通和交易负面清单，明确不能交易或严格限制交易的数据项。强化反垄断和反不正当竞争，加强重点领域执法司法，依法依规加强经营者集中审查，依法依规查处垄断协议、滥用市场支配地位和违法实施经营者集中行为，营造公平竞争、规范有序的市场环境。在落实网络安全等级保护制度的基础上全面加强数据安全保护工作，健全网络和数据安全保护体系，提升纵深防护与综合防御能力。
　　（十五）压实企业的数据治理责任。坚持“宽进严管”原则，牢固树立企业的责任意识和自律意识。鼓励企业积极参与数据要素市场建设，围绕数据来源、数据产权、数据质量、数据使用等，推行面向数据商及第三方专业服务机构的数据流通交易声明和承诺制。严格落实相关法律规定，在数据采集汇聚、加工处理、流通交易、共享利用等各环节，推动企业依法依规承担相应责任。企业应严格遵守反垄断法等相关法律规定，不得利用数据、算法等优势和技术手段排除、限制竞争，实施不正当竞争。规范企业参与政府信息化建设中的政务数据安全管理，确保有规可循、有序发展、安全可控。建立健全数据要素登记及披露机制，增强企业社会责任，打破“数据垄断”，促进公平竞争。
　　（十六）充分发挥社会力量多方参与的协同治理作用。鼓励行业协会等社会力量积极参与数据要素市场建设，支持开展数据流通相关安全技术研发和服务，促进不同场景下数据要素安全可信流通。建立数据要素市场信用体系，逐步完善数据交易失信行为认定、守信激励、失信惩戒、信用修复、异议处理等机制。畅通举报投诉和争议仲裁渠道，维护数据要素市场良好秩序。加快推进数据管理能力成熟度国家标准及数据要素管理规范贯彻执行工作，推动各部门各行业完善元数据管理、数据脱敏、数据质量、价值评估等标准体系。

　　六、保障措施

　　加大统筹推进力度，强化任务落实，创新政策支持，鼓励有条件的地方和行业在制度建设、技术路径、发展模式等方面先行先试，鼓励企业创新内部数据合规管理体系，不断探索完善数据基础制度。

　　（十七）切实加强组织领导。加强党对构建数据基础制度工作的全面领导，在党中央集中统一领导下，充分发挥数字经济发展部际联席会议作用，加强整体工作统筹，促进跨地区跨部门跨层级协同联动，强化督促指导。各地区各部门要高度重视数据基础制度建设，统一思想认识，加大改革力度，结合各自实际，制定工作举措，细化任务分工，抓好推进落实。
　　（十八）加大政策支持力度。加快发展数据要素市场，做大做强数据要素型企业。提升金融服务水平，引导创业投资企业加大对数据要素型企业的投入力度，鼓励征信机构提供基于企业运营数据等多种数据要素的多样化征信服务，支持实体经济企业特别是中小微企业数字化转型赋能开展信用融资。探索数据资产入表新模式。

　　（十九）积极鼓励试验探索。坚持顶层设计与基层探索结合，支持浙江等地区和有条件的行业、企业先行先试，发挥好自由贸易港、自由贸易试验区等高水平开放平台作用，引导企业和科研机构推动数据要素相关技术和产业应用创新。采用“揭榜挂帅”方式，支持有条件的部门、行业加快突破数据可信流通、安全治理等关键技术，建立创新容错机制，探索完善数据要素产权、定价、流通、交易、使用、分配、治理、安全的政策标准和体制机制，更好发挥数据要素的积极作用。
　　（二十）稳步推进制度建设。围绕构建数据基础制度，逐步完善数据产权界定、数据流通和交易、数据要素收益分配、公共数据授权使用、数据交易场所建设、数据治理等主要领域关键环节的政策及标准。加强数据产权保护、数据要素市场制度建设、数据要素价格形成机制、数据要素收益分配、数据跨境传输、争议解决等理论研究和立法研究，推动完善相关法律制度。及时总结提炼可复制可推广的经验和做法，以点带面推动数据基础制度构建实现新突破。数字经济发展部际联席会议定期对数据基础制度建设情况进行评估，适时进行动态调整，推动数据基础制度不断丰富完善。`,"case-262":`指导性案例262号

某科技有限公司诉某文化传媒有限公司不正当竞争纠纷案

　　（最高人民法院审判委员会讨论通过2025年8月28日发布）

　　关键词\xA0民事/不正当竞争/数据集合/数据搬运/经营性利益

　　裁判要点
　　网络平台经营者在其对数据集合形成的经营性利益受到侵害时，可以请求人民法院依法保护。对于未经许可获取并向公众提供相关数据，实质性替代网络平台产品或者服务，扰乱市场竞争秩序、损害网络平台经营者或者其他权利人合法权益的行为，人民法院可以适用《中华人民共和国反不正当竞争法》有关规定，认定构成不正当竞争行为。

　　基本案情

　　某科技有限公司（以下简称某科技公司）是甲APP的经营者。某文化传媒有限公司（以下简称某文化公司）是乙APP的经营者。2018年11月至2019年5月期间，乙APP上有50392个短视频与甲APP的短视频一致，且短视频中含有甲APP专有的代码。案涉短视频中，包含19079个注册用户昵称、用户头像。其中，15924个与甲APP相同；127处评论内容、顺序、标点符号与甲APP相同。经查，约40%的短视频具有独创性，构成作品；其余短视频有一定价值但不具有独创性，属于录像制品。

　　某科技公司以不正当竞争纠纷为由提起诉讼，诉称：某文化公司未经许可，直接抓取搬运甲APP中的案涉数据并在乙APP展示和传播，构成不正当竞争行为。因此，请求法院判令某文化公司消除影响、赔偿经济损失人民币4000万元。
　　某文化公司辩称：案涉短视频属于《中华人民共和国著作权法》保护的范畴，而某科技公司对甲APP中用户自行上传的短视频不享有权益。某文化公司开发的乙APP系为用户提供短视频上传的平台，其商业模式具有正当性。

　　裁判结果

　　北京市海淀区人民法院于2020年12月31日作出（2019）京0108民初35902号民事判决，判令某文化公司在《中国知识产权报》非中缝位置刊登声明，就案涉不正当竞争行为为某科技公司消除影响；某文化公司赔偿某科技公司经济损失人民币500万元。宣判后，某文化公司提起上诉。北京知识产权法院于2023年3月16日作出（2021）京73民终1011号民事判决：驳回上诉，维持原判。

　　裁判理由

　　本案的争议焦点有二：一是某科技公司对汇聚短视频、用户评论、用户信息形成的数据集合享有何种权益；二是某文化公司获取、使用案涉数据的行为是否构成不正当竞争行为。
　　其一，某科技公司对案涉数据集合享有经营性利益。著作权法保护具有独创性的智力成果，以及有一定价值但不具有独创性的录音录像制品等。本案中，案涉具有独创性的短视频构成作品，其余短视频构成录像制品，二者均受著作权法的保护。但作为数据汇聚者的某科技公司，并非案涉短视频的制作者，且其对案涉短视频的汇聚，仅按照网络平台常见的“视频、直播、音乐”等类别进行分类，选择和编排并未体现独创性，亦不构成汇编作品，故当他人大量搬运其平台汇聚的短视频时，某科技公司不能依据著作权法主张权益、寻求法律救济。
　　然而，案涉数据集合系某科技公司采集、汇聚而成。其中，除短视频外，还包括用户在上传和使用短视频时，根据用户协议发布的注册信息（昵称及头像）、用户评论等。概言之，案涉数据集合系用户遵循平台规则、借助平台提供的技术支持，经由与平台之间的交互关系形成，规模体量大、商业价值高。而某科技公司对数据集合的形成和积累实质性投入了人力、物力、财力，通过经营吸引大量用户流量，使得该数据集合额外产生独立于单一短视频的经济价值。由此，某科技公司持有、使用、经营短视频数据集合产生的经营性利益，应当受到法律保护。当然，这并不影响短视频制作者主张著作权法上的权利。
　　其二，某文化公司未经许可获取并向公众提供相关数据，足以实质性替代某科技公司提供的产品和服务，依法构成不正当竞争行为。经营者在生产经营活动中，应当遵循自愿、平等、公平、诚信的原则，遵守法律和商业道德。反不正当竞争法第二条第二款规定：“本法所称的不正当竞争行为，是指经营者在生产经营活动中，违反本法规定，扰乱市场竞争秩序，损害其他经营者或者消费者的合法权益的行为。”《最高人民法院关于适用〈中华人民共和国反不正当竞争法〉若干问题的解释》（法释〔2022〕9号）第一条规定：“经营者扰乱市场竞争秩序，损害其他经营者或者消费者合法权益，且属于违反反不正当竞争法第二章及专利法、商标法、著作权法等规定之外情形的，人民法院可以适用反不正当竞争法第二条予以认定。”

　　本案中，某文化公司未经许可，抓取搬运案涉数据集合中大量用户信息、短视频和用户评论在乙APP使用，导致乙APP与甲APP内容高度同质化，网络用户不使用甲APP，通过乙APP也可观看相同内容，实质性替代了某科技公司经营的甲APP产品和服务。由此，某文化公司抓取搬运案涉数据，并在乙APP使用的行为，损害了某科技公司的经营性利益。
　　综上，某文化公司的案涉行为扰乱市场竞争秩序，损害其他经营者、消费者合法权益。但案涉行为不属于反不正当竞争法第二章规定的不正当竞争行为，且某科技公司对案涉数据集合享有的经营性利益也无法依据著作权法等规定寻求保护，故人民法院依法适用反不正当竞争法第二条的规定，认定某文化公司的案涉行为构成不正当竞争行为。

　　需要说明的是，2025年6月27日第十四届全国人民代表大会常务委员会第十六次会议对反不正当竞争法作了第二次修订，在第十三条第三款对侵害数据权益的不正当竞争行为作出专门规定。鉴此，自2025年10月15日修订后的反不正当竞争法施行后，对相关行为是否构成不正当竞争行为，人民法院应当适用反不正当竞争法第十三条第三款及相关规定，依法准确认定。

某网络信息技术有限公司诉某信息科技有限公司不正当竞争纠纷案

　　（最高人民法院审判委员会讨论通过2025年8月28日发布）

　　关键词\xA0民事/不正当竞争/数据/关联账号服务/用户授权

　　裁判要点

　　网络平台向用户提供关联账号服务，经用户授权后转移其在关联网络平台获取的数据，为用户在合理范围内处理该数据提供便利，未扰乱市场竞争秩序的，不构成不正当竞争行为。

　　基本案情

　　某网络信息技术有限公司（以下简称某网络公司）运营甲网站，为求职者提供工作和职业发展机会。个人会员填写简历时可设置控制权限，既可以允许招聘企业用户搜索简历，也可以禁止包括招聘企业用户在内的任何人搜索。招聘企业用户在甲网站发布招聘职位后，求职者通过个人会员账号可以自行查找职位并主动向目标职位投递简历。此外，甲网站还为招聘企业用户提供有偿简历搜索服务，即招聘企业用户购买服务后，可以进入甲网站数据库搜索求职者允许搜索的简历。招聘企业用户通过上述接收投递和主动搜索两种方式获取的简历，可以在会员账号内查看、下载或者将简历发送到指定的邮箱。用户登录甲网站需要输入图片字符的验证码。
　　某信息科技有限公司（以下简称某信息公司）运营乙网站，主要提供简历管理、招聘管理、大数据服务等。乙网站设有“关联外网账号”功能，便于招聘企业用户集中处理在甲网站和其他网站获取的简历。招聘企业用户使用该功能需要专门授权，通过设置输入其在甲网站等其他网站的账号、密码后，即可自动登录关联网站，并可以自行选择是否同步获取简历到乙网站招聘管理流程或者简历库。

　　某网络公司发现，招聘企业用户在甲网站通过接收投递和主动搜索下载两种方式获取的个人简历，在使用“关联外网账号”功能后可以在乙网站中搜索到。对此，某信息公司提出，招聘企业用户在使用“关联外网账号”功能后仅能将简历同步到乙网站招聘企业用户自己的账号内，其他用户不能在乙网站汇聚简历库中搜索到。对于上述情况，某网络公司、某信息公司分别采取公证的方式固定相关证据。

　　2017年11月23日，某网络公司以不正当竞争纠纷为由提起诉讼，诉称：某信息公司提供关联账号服务，使用招聘企业用户账号、密码，避开身份验证码机制自动访问甲网站系统并获取、保存、使用案涉简历数据的行为构成不正当竞争行为，请求判令某信息公司停止不正当竞争行为、消除影响、赔偿经济损失人民币500万元。
　　裁判结果

　　上海市杨浦区人民法院于2019年5月17日作出（2017）沪0110民初25167号民事判决，驳回某网络公司的诉讼请求。宣判后，某网络公司提起上诉。上海知识产权法院于2020年10月13日作出（2019）沪73民终263号民事判决：驳回上诉，维持原判。

　　裁判理由

　　本案的争议焦点为：某信息公司提供关联账号服务并获取、保存、使用案涉简历数据的行为是否构成不正当竞争行为。
　　第一，关联账号服务是网络空间中较为常见的服务模式。具体而言，关联账号服务系通过绑定用户在不同网络平台上的多个账号，达到共享数据、权限或者功能的目的，以提供更为便捷的使用体验。例如，目前网络招聘服务市场上存在众多信息发布平台，招聘企业为了获取更多人才资源信息，一般会同时注册成为多家招聘网站的企业用户。为了方便招聘企业用户同时管理这些分散在不同平台的求职信息，一些经营者采用网站关联技术汇聚不同平台数据，便于招聘企业用户通过其网站关联到原有平台账号，进而汇聚信息进行“一站式”处理。又如，在电子邮箱领域不少亦运用关联账号功能。在不侵害数据安全、个人信息和社会公共利益的前提下，网络用户使用关联账号功能，将其持有的数据在不同网络平台间转移，系合法正当行为。
　　第二，某信息公司提供关联账号服务的行为具有正当性。某网络公司对甲网站所采集生成的数据有实质性投入和贡献，享有受法律保护的权益，但不得阻碍招聘企业用户对所收集的数据进行转移等合理处理。据此，相关招聘企业用户对通过有偿支付对价、接受求职者投递等方式收集的简历数据，可以进行转移，包括使用关联账号进行转移。而且，案涉关联账号未超出求职者对个人信息处理范围的预期。招聘企业用户在使用“关联外网账号”功能后仅能将简历同步到乙网站中招聘企业用户自己的账号内，求职者的信息无法在乙网站汇聚简历库中搜索到，不存在侵害求职者合法权益的情形。
　　第三，某信息公司经用户授权获取、保存、使用甲网站简历数据的行为不构成不正当竞争行为。其一，某信息公司所提供的关联账号服务，需要由招聘企业用户自行选择是否关联、是否自动同步或者保存简历，并自行输入其在甲网站等其他网站的账号、密码。关联账号功能服务的实现均为用户自己的意愿，且需要由用户自行实施相应操作。其二，经技术调查官查证，某信息公司设置程序读取验证码，系实现关联账号功能所使用的一种技术手段，便于用户关联账号后无需另行验证即可登录网站，不构成《中华人民共和国反不正当竞争法》规定的“妨碍、破坏其他经营者合法提供的网络产品或者服务正常运行的行为”。其三，招聘企业用户使用乙网站的关联账号服务并选择同步简历，会使其在甲网站上获取的简历下载至乙网站服务器，这是关联账号功能实现的必然结果。同时，同步到乙网站的简历只能在招聘企业用户的账号中搜索浏览，他人无法在乙网站获取。故而，案涉获取、保存数据的行为亦不属于不正当竞争行为。

　　综上，某信息公司的案涉行为没有扰乱市场竞争秩序，亦未损害其他经营者、消费者的合法权益，不构成不正当竞争行为。

某钢铁有限公司诉某电子商务股份有限公司侵权责任纠纷案

　　（最高人民法院审判委员会讨论通过2025年8月28日发布）

　　关键词\xA0民事/侵权责任/企业数据/数据产品/数据处理者

　　裁判要点

　　数据处理者依法采集企业数据，经符合有关标准的编制方法加工形成数据产品并合理利用，未对企业权益造成损害，相关企业要求数据处理者承担侵权责任的，人民法院依法不予支持。

　　基本案情

　　某钢铁有限公司（以下简称某钢铁公司）生产、经销特种钢材，每天主要通过两种方式发布出厂价格：一是主动在微信群发布。有的微信群无入群资格审核和身份限制，以客户为主，人数达上百人；而有的微信群，则由某钢铁公司和一级代理商组成。二是直接电话告知特定客户。
　　某电子商务股份有限公司（以下简称某电子公司）系某网站及其APP的运营商，每日发布各类钢材价格指数。某电子公司的经营范围包括互联网数据服务、大数据服务、数据处理服务，系“商贸流通业典型统计调查企业”。某电子公司为采集钢铁价格信息，组建信息采集团队，通过在公众号和微信群中采集、电话询问、销售合同披露三种方式，向钢铁生产企业、贸易商等采集钢材产品出厂价格、代理商价格、合同交易价格等，并在向采集对象询问价格信息的过程中，同时为其提供市场行情、市场分析等服务。某电子公司对采集的各类价格经算法技术加工后，编制成价格指数，在某网站及其APP上发布。某电子公司的价格指数编制准则经“上海标准”评价委员会、上海市标准化协会评定，获得“上海标准”标识证书。某电子公司发布的数据不是原始出厂价格，而是价格指数，即产品在某地区范围内市场流通中的实际可成交价格或者价格水平（反映一定地区、一定时期某类商品的综合平均价格指标）。某电子公司的信息服务采用会员制。
　　2019年，某电子公司即在某网站及其APP上公布某钢铁公司的钢材产品的品名、价格、涨跌等信息。为使用数据服务、进行品牌推广，某钢铁公司于2020年11月18日与某电子公司签订合作协议，约定某电子公司为某钢铁公司提供数据服务、品牌推广等，某钢铁公司向某电子公司支付服务费。就服务所需的数据，协议约定某电子公司每天在全国市场中采集某钢铁公司的价格信息并及时公布。自2021年5月24日起，某钢铁公司多次提出，某电子公司所公布钢材价格指数中涉及某钢铁公司的价格，与同区域、同档次其他公司的产品价格差异太大，要求某电子公司将相关产品价格数据下架。2021年11月30日，双方解除合作协议，但某电子公司仍继续公布某钢铁公司的上述价格数据。

　　某钢铁公司以侵权责任纠纷为由提起诉讼，诉称：某电子公司未经同意擅自采集、加工或者编造数据，采集、加工过程不规范、不公允，以此形成并发布的数据不真实，侵害其合法权益。据此，请求判令某电子公司立即删除某网站及其APP中所有关于某钢铁公司的信息。

　　裁判结果
　　上海市宝山区人民法院于2023年8月24日作出（2023）沪0113民初23152号民事判决，驳回某钢铁公司的诉讼请求。宣判后，某钢铁公司提起上诉。上海市第二中级人民法院于2024年6月19日作出（2023）沪02民终11028号民事判决：驳回上诉，维持原判。

　　裁判理由

　　本案的争议焦点为：某电子公司采集发布案涉数据的行为，是否侵害某钢铁公司的合法权益。
　　第一，某钢铁公司和某电子公司分别享有不同的数据权益。某钢铁公司作为钢材生产商，在生产和对外销售各种型号钢材的过程中，产生一系列的价格数据。某电子公司作为数据处理者，采集汇总包括某钢铁公司产品的出厂价格、代理商价格在内的原始数据，经过算法技术加工后形成数据产品。对此，应当根据数据来源和生成特征，妥当界分数据参与各方享有的权益：（1）产品出厂价格是某钢铁公司在经营主营业务过程中产生的数据，某钢铁公司享有持有、使用等权益，但钢材交易市场是竞争较为充分的市场，产品出厂价格已公开，某钢铁公司不能禁止他人合法合理采集使用；（2）由于代理商价格是在某钢铁公司产品出厂后的下游交易链条中产生，并无证据证明某钢铁公司直接参与了该数据的产生、发布，故难以认定某钢铁公司对代理商价格享有限制他人采集使用的权益；（3）根据国家发展改革委关于价格指数行为管理的相关规定，在中华人民共和国境内依法成立的企业、事业单位、团体及其他组织可以编制发布价格指数。据此，某电子公司可以编制发布钢材价格指数。而相关价格指数系某电子公司通过采集原始价格数据后，经技术分析而成，属于数据产品。对于这一数据产品，某电子公司享有经营性利益。
　　第二，某电子公司采集加工数据的行为具有正当性。数据信息具有非排他性。通常而言，对于不属于国家秘密、个人信息和商业秘密的数据信息，应允许自由流动，非因法定事由不应过度管控，以防止形成“数据壁垒”、“信息封闭”。本案中，案涉产品出厂价格系公开市场中自由流通的信息，不涉及产品成本、工艺等商业秘密，采集、使用该类信息用于编制行业价格指数，没有违反法律法规。具体而言，其一，某钢铁公司主张其产品的出厂价格属于商业秘密。根据《中华人民共和国反不正当竞争法》的规定，构成商业秘密，应满足不为公众所知悉、具有商业价值、采取保密措施三个条件。根据《最高人民法院关于审理侵犯商业秘密民事案件适用法律若干问题的规定》（法释〔2020〕7号）第四条第一款第五项的规定，“所属领域的相关人员从其他公开渠道可以获得该信息的”，人民法院可以认定有关信息为公众所知悉。而某钢铁公司主动在无入群资格审核的数百人的微信群中发布产品出厂价格，也未禁止群成员对外再传播。可见，某钢铁公司未采取有效保密措施，其产品出厂价格已在一定范围公开，不符合“不为公众所知悉”的商业秘密构成要件。因此，某钢铁公司关于案涉数据构成商业秘密的主张不能成立。其二，某钢铁公司与某电子公司签订合作协议的目的是购买某电子公司的相关服务，而非授权某电子公司采集、加工、使用出厂价格，故案涉合同关系并非某电子公司采集出厂价格具备合法性的必要条件。其三，根据国家发展改革委关于价格指数行为管理的相关规定，某电子公司组建信息采集团队，通过在公众号和微信群中采集、电话询问、销售合同披露等方式独立采集数据，并未采取误导、欺诈、胁迫、窃取等方式，其信息来源合法。
　　第三，没有证据证明某钢铁公司的数据权益受到损害。某电子公司正当获取和合理使用案涉数据的行为，实际并未影响或者剥夺某钢铁公司对出厂价格数据的持有、使用等权益，更未对某钢铁公司造成经济损失，故某电子公司并未损害某钢铁公司的数据权益。当然，如果有证据证明数据质量存在问题，某钢铁公司可以向某电子公司主张承担包括损害赔偿在内的相关责任。但是，本案并无证据证明数据质量存在问题。某电子公司合法采集某钢铁公司的价格数据，编制方法符合有关标准，故基础数据和编制方法均无问题；而某钢铁公司称数据产品不真实、不客观、不公允，但未提供充分证据证明。

　　综上，某电子公司采集加工数据行为不存在侵害某钢铁公司数据权益的情形，且根据在案证据无法认定数据产品质量存在问题。对某钢铁公司关于某电子公司采集加工数据形成数据产品侵害其合法权益的主张，人民法院依法不予支持。

　　相关法条

四川省数据条例

（2022年12月2日四川省第十三届人民代表大会常务委员会第三十八次会议通过）

第二章 数据资源
第三章 数据流通

第四章 数据应用

第五章 数据安全

第六章 区域合作

第一章 总 则

第一条 为了加强数据资源管理，规范数据处理活动，保护自然人、法人和非法人组织的合法权益，保障数据安全，促进数据依法有序流通和应用，推动以数据为关键要素的数字经济发展，根据《中华人民共和国数据安全法》、《中华人民共和国个人信息保护法》等有关法律、行政法规，结合四川省实际，制定本条例。

第二条 四川省行政区域内数据资源管理、数据流通、数据应用、数据安全和区域合作等活动，适用本条例。

第三条 县级以上地方各级人民政府应当加强对数据工作的领导，统筹推进数据管理工作，建立协调机制和考核评价机制，将数据开发利用和产业发展纳入国民经济和社会发展规划，制定支持数据领域发展的政策措施，整合本行政区域数据领域发展资源，培育数据要素市场，发挥数据在促进经济发展、服务改善民生、完善社会治理等方面的作用。

第四条 县级以上地方各级人民政府应当明确数据管理机构负责本行政区域数据统筹管理、开发利用和监督检查，以及推进数据资源体系建设和数据要素市场培育等工作。
第五条 发展改革、经济和信息化等主管部门按照各自职责，做好数据领域发展促进工作。

网信部门负责统筹协调个人信息保护、网络数据安全和相关监管工作。公安、国家安全机关依法在各自职责范围内负责数据安全相关工作。

各行业主管部门在各自职责范围内负责本行业、本领域的数据相关工作。

第六条 县级以上地方各级人民政府应当加强数字基础设施建设的统筹协调，将数字基础设施的建设和布局纳入国土空间规划，结合实际编制和实施数字基础设施建设规划，并与交通运输、能源、水利、市政等基础设施专项规划相衔接。

县级以上地方各级人民政府及其有关部门应当提升电子政务云、电子政务外网等的服务能力，建设新一代通信网络、新型数据中心等重大基础设施，建立完善网络、存储、计算、安全等数字基础设施。

第七条 省人民政府标准化行政主管部门应当会同有关部门加强数据标准体系建设和管理，制定完善并推广数据收集、共享、开放、应用等标准规范。

鼓励企业、科研机构和社会团体等参与制定数据国家标准、行业标准、团体标准和地方标准等技术规范。
第八条 数据相关行业组织应当建立健全行业规范，主动接受相关主管部门的指导、监督，加强行业自律，推动行业诚信建设，监督、引导从业者依法开展数据相关活动，促进行业健康发展。

第九条 自然人的个人信息受法律保护，任何组织、个人不得侵害自然人的个人信息权益。

履行个人信息保护和数据安全管理职责的部门应当建立数据监管相关的投诉、举报制度，收到投诉、举报后及时依法处理，并对相关信息予以保密。

第二章 数据资源

第十条 省数据管理机构应当会同相关部门按照国家规定，建立全省统一的公共数据资源体系，推进公共数据资源依法采集汇聚、加工处理、共享开放、创新应用。

本条例所称 公共数据，是指国家机关和法律、法规授权的具有管理公共事务职能的组织（以下统称政务部门）为履行法定职责收集、产生的政务数据，以及医疗、教育、供水、供电、供气、通信、文化旅游、体育、交通运输、环境保护等公共企业事业单位（以下统称公共服务组织）在提供公共服务过程中收集、产生的涉及公共利益的公共服务数据。

第十一条 省数据管理机构负责推动构建全省公共数据资源中心体系和建设公共数据资源管理平台，支撑公共数据汇聚、存储、共享、开放和安全管理等工作。
政务部门和财政资金保障运行的公共服务组织不得新建跨部门、跨层级的公共数据资源管理平台；已经建成的，应当按照规定进行整合。

第十二条 省数据管理机构会同有关部门，按照国家有关公共数据分类分级的要求，制定本省公共数据分类分级规则，促进公共数据分类分级管理。

省有关行业主管部门可以根据国家和省公共数据分类分级的相关规定，制定本行业公共数据分类分级实施细则。

第十三条 省数据管理机构应当会同有关部门建立和完善人口、法人、自然资源和空间地理、社会信用信息、电子证照等基础数据库，以及宏观经济、政务服务、社会治理、生态环境、民生保障等跨地区、跨部门、跨层级主题数据库。

第十四条 公共数据实行目录化管理。省数据管理机构应当统筹推进全省公共数据目录管理，制定统一的目录编制指南，组织编制、发布全省公共数据目录并动态更新。

市（州）、县（市、区）数据管理机构应当按照目录编制指南，组织编制本级公共数据子目录，报上一级数据管理机构审核。

政务部门和公共服务组织应当按照目录编制指南，编制本单位公共数据子目录，报同级数据管理机构审核。
第十五条 政务部门和公共服务组织应当按照一项数据有且只有一个法定数源部门的原则，依照法定的权限、程序和标准规范收集公共数据，不得超出履行法定职责所必需的范围和限度。

除法律、行政法规另有规定外，可以通过共享获取的公共数据，不得重复收集。

收集公共数据应当分别以下列号码或者代码作为必要标识：

（一）公民身份号码或者个人其他有效身份证件号码；

（二）法人统一社会信用代码；

（三）非法人组织统一社会信用代码或者其他识别代码；

（四）依据相关数据标准确定的代码标识。政务部门和公共服务组织收集数据时，已经通过有效身份证件验明身份的，不得强制通过收集指纹、虹膜、人脸等生物识别信息重复验证。法律、行政法规另有规定的除外。

第十六条 在商场、超市、公园、景区、公共文化体育场馆、宾馆等公共场所，以及居住小区、商务楼宇等公共区域，安装图像收集、个人身份识别设备，应当以维护公共安全为目的，遵守国家有关规定，并设置显著标识，不得以图像采集、个人身份识别技术作为出入该场所或者区域的唯一验证方式。

所收集的个人图像、身份识别信息只能用于维护公共安全的目的；取得个人授权的除外。
第十七条 发生突发事件时，县级以上地方各级人民政府及其有关部门可以按照应对突发事件有关法律、法规规定，要求相关自然人、法人和非法人组织提供应对突发事件所必需的数据。

要求自然人、法人和非法人组织提供前款所需数据的，应当依照法定条件和程序进行，并明确告知数据使用的目的、范围、方式和期限。对在履行职责中知悉的个人隐私、个人信息、商业秘密、保密商务信息等数据应当依法予以保密，不得泄露或者非法向他人提供。使用期限届满后，应当依法及时对数据进行删除、封存、匿名化处理等方式妥善处理，并关停相关数据应用。

第十八条 政务部门和财政资金保障运行的公共服务组织为依法履行职责或者提供公共服务需要的数据，不能通过共享方式获取的，经同级数据管理机构确认后可以通过采购获取。

第十九条 政务部门和公共服务组织应当依据公共数据目录，将本单位公共数据汇聚至省、市（州）数据资源中心；依照法律、行政法规规定未能汇聚的数据，应当经本级数据管理机构确认，并以适当方式进行数据共享和开放。
省公共数据资源中心汇聚的公共数据应当及时按照属地原则回流至市（州）公共数据资源中心。市（州）公共数据资源中心应当为县（市、区）、乡（镇）使用公共数据提供支撑。

第二十条 省数据管理机构会同有关部门建立健全以下公共数据治理工作机制：

（一）建立公共数据资源普查制度，编制公共数据资源清单，实现公共数据资源统一管理；

（二）建立公共数据质量管控制度，实现问题数据可追溯、可定责，保证数据及时、准确、完整；

（三）建立公共数据校核制度，自然人、法人和非法人组织发现涉及自身的公共数据不准确、不完整的，可以向政务部门或者公共服务组织提出校核申请，相关政务部门、公共服务组织应当及时依法处理并反馈；

（四）建立公共数据使用情况统计反馈制度，由省数据管理机构统计并定期向数据来源部门反馈公共数据的归集、使用、交易等情况。

第二十一条 自然人、法人和非法人组织可以通过合法、正当的方式收集非公共数据。收集已公开的非公共数据，不得违反法律、行政法规的规定，不得侵犯他人的合法权益。法律、行政法规对非公共数据收集的目的和范围有规定的，从其规定。
自然人、法人和非法人组织在收集非公共数据时，不得实施下列侵害其他市场主体合法权益的行为：

（一）使用非法手段获取其他市场主体的数据；

（二）利用非法收集的其他市场主体数据提供替代性产品或者服务；

（三）法律、行政法规规定禁止的其他行为。

第三章 数据流通

第二十二条 省数据管理机构应当会同相关部门按照国家要求，深化数据要素市场化配置改革，培育公平、开放、有序、诚信的数据要素市场，推进公共数据共享、开放、授权运营，规范数据交易，促进数据要素依法有序流通。

第二十三条 公共数据以共享为原则、不共享为例外。

公共数据共享，是指政务部门和公共服务组织为履行法定职责或者提供公共服务需要，依法使用其他政务部门和公共服务组织的公共数据，以及为其他政务部门和公共服务组织提供公共数据的行为。

公共数据按照共享属性分为无条件共享、有条件共享、不予共享三类。

政务部门和公共服务组织应当按照国家和省有关规定对收集、产生的公共数据进行评估，科学合理确定共享属性，并定期更新。列入有条件共享数据的，应当说明理由并明确共享条件；列入不予共享数据的，应当提供明确的法律、法规、规章或者国家有关规定。
第二十四条 政务部门和公共服务组织需要获取无条件共享公共数据的，可以通过共享平台直接获取；需要获取有条件共享公共数据的，应当通过共享平台向本级数据管理机构提出共享申请，并列明理由、依据、用途等。

数据管理机构应当自收到申请之日起五个工作日内依据数据共享目录予以答复，可共享的，应当予以共享；不可共享的，应当说明理由，并提供依据；不能确定能否共享的，答复期限可以延长五个工作日，并应当通过平台向数据提供单位征求是否共享。

数据提供单位应当在三个工作日内答复数据管理机构。同意共享的，数据管理机构应当在两个工作日内予以共享；不同意共享的，应当说明理由，数据管理机构应当在两个工作日内完成审核，并告知数据申请单位。

第二十五条 政务部门和公共服务组织应当在授权使用的方式、范围和期限内，使用通过共享获取的公共数据，不得用于本单位履行职责之外的其他目的。

第二十六条 政务部门和公共服务组织向社会开放公共数据，应当遵循公正、公平、便民、安全的原则。公共数据开放，不得收取任何费用。

公共数据开放，是指政务部门和公共服务组织向社会依法提供公共数据的行为。

公共数据按照开放属性分为无条件开放、有条件开放、不予开放三类。
法律、行政法规规定不得开放以及开放后可能危及国家安全、危害公共利益、损害民事权益的公共数据，列入不予开放类；需要依法授权向特定自然人、法人和非法人组织开放的公共数据，列入有条件开放类；其他公共数据列入无条件开放类。法律、行政法规另有规定的除外。

县级以上地方各级人民政府应当依法最大限度向社会有序开放公共数据，并推动企业登记监管、卫生、交通运输、气象等高价值数据优先开放。

第二十七条 省数据管理机构根据国家和省有关公共数据分类分级要求，组织编制全省公共数据开放目录和相关责任清单。市（州）数据管理机构可以组织编制本行政区域公共数据开放子目录。

第二十八条 自然人、法人和非法人组织需要获取无条件开放公共数据的，可以通过开放平台直接获取；需要获取有条件开放公共数据的，应当依据目录通过开放平台向数据管理机构提出开放申请，并列明理由、依据、用途等。

数据管理机构应当自收到开放申请之日起五个工作日内依据开放目录予以答复，可开放的，应当予以开放；不同意开放的，应当说明理由，并提供依据；数据管理机构依据开放目录不能确定能否开放的，答复期限可以延长五个工作日，并应当通过平台向数据提供单位征求是否开放。
数据提供单位应当在三个工作日内答复数据管理机构，同意开放的，数据管理机构应当在两个工作日内予以开放。不予开放的，应当说明理由，数据管理机构应当在两个工作日内完成审核，并告知数据申请者。

第二十九条 自然人、法人和非法人组织申请有条件开放公共数据的，应当签订数据利用承诺书。

数据利用承诺书范本由省数据管理机构会同相关部门制定。数据利用承诺书应当明确拟使用数据的清单、用途、应用场景、安全保障措施、使用期限以及期满后数据的处置、数据使用情况反馈等内容。

第三十条 签订数据利用承诺书的申请人应当采取安全保障措施，在规定的范围内使用数据，并向数据管理机构反馈数据使用情况；不得将获取的公共数据用于规定使用范围之外的其他用途，不得篡改、破坏、泄露所获取的公共数据，不得以获取的公共数据危害国家安全、侵犯商业秘密或者个人隐私。

使用开放的公共数据形成研究报告、学术论文、知识产权、数据服务、应用产品等成果的，应当在成果中注明数据来源。

第三十一条 鼓励自然人、法人和非法人组织依法共享、开放其合法收集的自有商业数据等非公共数据，法律、行政法规另有规定的除外。
省数据管理机构应当会同相关部门建立多元化的数据合作机制，加强公共数据和非公共数据融合。引导企业、行业协会、科研机构等依法收集、整合行业和市场数据，结合开放的公共数据，开发数据产品和服务。

第三十二条 县级以上地方各级人民政府可以在保障国家秘密、国家安全、社会公共利益、商业秘密、个人隐私和数据安全的前提下，授权符合规定安全条件的法人或者非法人组织开发利用政务部门掌握的公共数据，并与授权运营单位签订授权运营协议。

省数据管理机构应当会同相关部门建立公共数据授权运营机制，制定公共数据授权运营管理办法，报省人民政府批准后实施。数据管理机构应当根据公共数据授权运营管理办法对授权运营单位实施日常监督管理。

第三十三条 省数据管理机构会同相关部门建立数据交易管理制度，规范数据交易行为，建立资产评估、登记结算、交易撮合、争议解决等数据要素市场运营体系。

第三十四条 政务部门和财政资金保障运行的公共服务组织应当通过依法设立的数据交易场所开展数据交易；鼓励符合条件的市场主体在依法设立的数据交易场所开展数据交易。
第三十五条 数据交易应当遵循自愿、平等、公平和诚实守信原则，遵守法律法规和商业道德，履行数据安全保护、个人信息保护、知识产权保护等方面的义务。

有下列情形之一的，不得交易：

（一）危害国家安全、公共利益，侵害个人隐私的；

（二）未经合法权利人授权同意的；

（三）法律、法规规定禁止交易的其他情形。

第三十六条 数据交易服务机构应当建立规范透明、安全可控、可追溯的数据交易服务环境，制定交易服务流程、内部管理制度以及机构自律规则，采取有效措施保护个人隐私、个人信息、商业秘密、保密商务信息等数据，并在提供服务过程中，遵守下列规定：

（一）要求数据提供方说明数据来源；

（二）审核数据交易双方的身份；

（三）留存相关审核、交易记录；

（四）监督数据交易、结算和交付；

（五）采取必要技术手段确保数据交易安全；

（六）其他法律、法规的规定。

第三十七条 数据管理机构应当会同相关部门支持数据交易服务机构有序发展，指导其提供数据资产、数据合规性、数据质量等第三方评估以及交易撮合、交易代理、专业咨询、数据经纪、数据交付等专业服务。
第三十八条 自然人、法人和非法人组织可以依法使用、加工合法取得的数据；对依法加工形成的数据产品和服务，可以依法获取收益。

自然人、法人和非法人组织在使用、加工等数据处理活动中形成的法定或者约定的财产权益，以及在数字经济发展中有关数据创新活动取得的合法权益受法律保护。

自然人、法人和非法人组织使用、加工数据，应当遵守法律、法规，尊重社会公德和伦理，遵守商业道德，诚实守信，不得危害国家安全和公共利益，不得损害他人的合法权益。

第三十九条 自然人、法人和非法人组织应当依法开展数据交易、流通、合作等活动，并对数据实施保护和管理。

自然人、法人和非法人组织依法获取的个人信息数据经过处理无法识别特定个人且不能复原的，或者取得特定数据提供者明确授权的，可以交易、交换或者以其他方式开发利用。

自然人、法人和非法人组织对数据的使用应当遵守反垄断、反不正当竞争、消费者权益保护等法律、法规规定，不得利用市场支配地位从事操纵市场、设置排他性合作条款等活动；不得滥用大数据分析等技术手段，基于个人消费数据和消费偏好设置不公平交易条件或者诱导用户沉迷、过度消费的数据服务规则，侵犯消费者合法权益。

第四章 数据应用
第四十条 县级以上地方各级人民政府应当强化创新服务，激活数据要素潜能，推动数据有效应用。

第四十一条 县级以上地方各级人民政府及其有关部门应当加快推进数字政府建设，将数字技术广泛应用于经济调节、市场监管、社会管理、公共服务、生态环境保护等方面，提高决策科学化水平和管理服务效率。依托天府通办和省一体化政务服务平台，推进政务服务一网通办、全程网办，开发数据应用场景，促进政务服务跨层级、跨地域、跨系统、跨部门、跨业务协同，提升公共服务能力。加快推进数字机关建设，提升政务运行效能。

第四十二条 省人民政府及其有关部门应当制定措施培育壮大数据采集、存储管理、挖掘分析、交易流通、安全保护等数据核心产业，发展人工智能、大数据、区块链、云计算、数据存储、物联网、高端软件、网络安全等特色产业。

第四十三条 县级以上地方各级人民政府及其有关部门应当促进数字技术与实体经济深度融合，推动传统产业数字化、网络化、智能化发展。

鼓励开展数据融合应用，加快数据赋能生产制造、科技研发、金融服务、商贸流通、农业等领域和市政、交通运输、能源、环保、水利、物流、园区等的数字化改造和智能化升级。
第四十四条 县级以上地方各级人民政府及其有关部门应当规范发展共享经济、平台经济、在线文娱、数字文创、智慧文旅等新业态，提高公共卫生、医疗、教育、养老、就业等基本民生领域和商业、文娱、体育、旅游等民生领域的数字化水平。支持手机应用程序、智慧终端设施、各类公共服务设施面向残疾人和老年人开展适应性数字化改造。

第四十五条 县级以上地方各级人民政府及其有关部门应当应用数据赋能城市治理，统筹建设城市大脑，提升智能感知、数据处理、分析研判、协同指挥和科学治理水平，推动城市管理和服务数字化、网络化、智能化。

应用数字技术赋能数字乡村，开展智慧农业、农村电商等建设，提升农业农村生产经营精准化、管理服务智能化、乡村治理数字化水平。

加大对革命老区、民族地区和农村地区资金、技术、人才等方面的支持，优化数字公共产品供给，加强数字基础设施建设，提升数字基础设施建设水平和覆盖质量。

第四十六条 县级以上地方各级人民政府应当结合实际统筹安排产业发展等相关资金支持数据领域发展和建设，重点支持数据领域核心关键技术攻关、产业链构建、基础设施建设、市场主体培育等。
鼓励以市场化方式设立数据领域的创业投资基金，引导社会资本投资数据应用，支持符合条件的相关企业上市和发债融资。

第四十七条 县级以上地方各级人民政府及其有关部门应当完善政策措施，在土地、电力、能耗指标等生产要素方面优先保障数据领域发展。

第四十八条 县级以上地方各级人民政府及其有关部门应当推动数据领域科技创新平台建设，积极引进高水平数据科研机构和企业在本省设立分支机构或者研发中心，支持企业与高校、科研院所等单位合作开展数据领域关键技术攻关，构建多元参与的创新生态体系。

第四十九条 县级以上地方各级人民政府及其有关部门应当将数字化能力培养纳入教育培训体系，培养和引进高素质科技人才和技能人才。对数据领域发展作出突出贡献的人才，按照有关规定给予奖励。

第五十条 广播、电视、报刊、互联网等新闻媒体应当开展数据领域相关的公益宣传，推动形成全社会共同维护数据安全和促进发展的良好环境。

第五十一条 省人民政府设立数据专家咨询委员会，加强数据领域的理论研究，推进数据领域技术交流与合作，为数据应用以及相关工程实施提供决策咨询。
第五十二条 县级以上地方各级人民政府及其有关部门应当改进监管技术和手段，完善监管体系，对数据领域的新技术、新产业、新业态和新模式等实行包容审慎监管。

第五章 数据安全

第五十三条 省人民政府应当统筹全省数据安全管理工作，建立数据安全责任制，完善数据安全综合治理体系。

政务部门和公共服务组织应当建立数据安全管理制度，编制并组织实施本单位的数据安全规划和数据安全应急预案，定期组织开展本单位的数据安全风险评估，指导督促数据处理者及时对存在的风险隐患进行整改。

第五十四条 数据处理者开展数据处理活动应当符合法律、法规的规定，建立数据安全常态化运行管理机制，履行以下数据安全保护义务：

（一）依法建立健全全流程数据安全管理制度、技术规范和操作规程；

（二）设置数据安全管理岗位，实行管理岗位责任制，配备安全管理人员和专业技术人员；

（三）组织开展数据安全教育、技术培训；

（四）加强数据安全日常管理和检查，对复制、导出、脱敏、销毁数据等可能影响数据安全的行为，以及可能影响个人信息保护的行为进行监督；

（五）制定数据安全应急预案，开展应急演练；
（六）加强风险监测，发现数据安全缺陷、漏洞等风险时，应当立即采取补救措施；

（七）按照分类分级保护要求，采取安全保护技术措施，防止数据丢失、篡改、破坏和泄露，保障数据安全；

（八）发生数据安全事件时，应当立即采取处置措施，按照规定及时告知用户并向有关主管部门报告；

（九）法律、法规规定的其他数据安全保护义务。

第五十五条 数据处理者委托他人代为处理数据的，应当与其订立数据安全保护合同，明确双方数据安全保护责任，受托方应当依照法律、法规、规章的规定和合同约定履行数据安全保护义务。

受托方完成数据处理任务后，应当及时有效销毁其存储的数据，不得擅自留存、使用、泄露或者向他人提供数据，法律、法规另有规定或者双方另有约定的除外。

第五十六条 政务部门和公共服务组织依法委托第三方服务机构开展平台建设以及运行维护的，应当按照国家和省有关规定对服务提供方进行安全审查；经安全审查符合条件的，签订服务外包协议时应当同时签订服务安全保护以及保密协议，并监督服务提供方履行数据安全保护义务。

第五十七条 省网信部门会同有关部门建立健全本省数据分类分级保护制度，按照国家规定编制本省重要数据目录，加强对重要数据的保护。
第五十八条 省网信部门会同有关部门建立健全数据安全风险评估、报告、信息共享、监测预警机制，指导各地区各部门加强数据安全风险信息的获取、分析、研判、预警工作。

第五十九条 省网信部门会同有关部门建立健全数据安全应急处置机制，指导有关部门加强应急处置能力建设。

发生数据安全事件，有关主管部门应当依法启动应急预案，采取应急处置措施，防止危害扩大，消除安全隐患，并及时向社会发布与公众有关的警示信息。

第六十条 网信部门和有关主管部门在履行数据安全监管职责中，可以依法委托第三方机构对数据处理者开展数据安全检测评估、认证。

支持数据安全检测评估、认证等专业机构依法开展服务活动。鼓励有关部门、行业组织、企业、教育科研机构和有关专业机构等在数据安全风险评估、防范、处置等方面开展协作。

第六十一条 网信部门和有关主管部门应当建立数据安全监督检查机制，依法处理数据安全事件。

在履行数据安全监管职责中，发现数据处理活动存在较大安全风险的，可以按照法定权限和程序对有关组织、个人进行约谈，并要求有关组织、个人采取措施进行整改，及时消除隐患。
第六十二条 鼓励数据保护关键技术和安全监管技术创新研究，支持教育科研机构和企业开展数据安全关键技术攻关，部署应用隐私计算、区块链、量子密码等安全技术，推动政府、行业、企业数据风险信息共享。

第六章 区域合作

第六十三条 加强数据领域省际合作，按照区域数据要素流通需求，推动数据安全流通技术的应用，促进区域间数据共享交换，建立跨区域的数据融合发展应用机制，发挥数据在跨区域协同发展中的创新驱动作用。

第六十四条 依托国家统一平台，按照区域应用协同需求，与其他省、自治区、直辖市共同促进公共数据共享交换平台建设，支撑区域公共数据共享共用、业务协同和应用场景开发。

第六十五条 依托国家统一平台，与其他省、自治区、直辖市共同促进数字认证、电子证照等跨区域互通互认，支撑政务服务跨区域协同。

第六十六条 本省按照成渝地区双城经济圈建设等国家战略要求，与重庆市共同开展川渝地区数据标准化体系建设，共同建立数据基础性标准和规范，促进数据资源跨区域共享和利用。
第六十七条 按照国家部署，加快实施“东数西算”工程，与重庆市共同建设全国一体化算力网络国家枢纽节点，优化数据中心和存储算力资源布局，培育国家级数据中心集群，引导数据中心集约化、规模化、绿色化发展，推动算力、算法、数据集约化和服务化创新，加快融入全国一体化大数据中心协同创新体系。

第七章 法律责任

第六十八条 违反本条例规定的行为，法律、行政法规已有法律责任规定的，适用其规定。

第六十九条 国家机关、履行公共管理和服务职责的事业单位及其工作人员违反本条例规定，有下列行为之一的，由本级人民政府或者上级机关责令改正；造成不良后果或者影响的，对负有责任的领导人员和直接责任人员依法给予处分；构成犯罪的，依法追究刑事责任：

（一）未按照规定收集、汇聚、共享、开放、应用公共数据的；

（二）未按照规定开展公共数据目录编制、公共数据普查、质量管控工作的；

（三）对自然人、法人和非法人组织的校核申请不及时依法处理的；

（四）未依法履行数据安全监管职责的；

（五）篡改、伪造、破坏、泄露公共数据的；

（六）滥用职权、玩忽职守、徇私舞弊的；

（七）违反本条例规定的其他情形。

第八章 附 则

第一章　总　　则
第一条　为了促进社会主义市场经济健康发展，鼓励和保护公平竞争，预防和制止不正当竞争行为，保护经营者和消费者的合法权益，制定本法。

第二条　经营者在生产经营活动中，应当遵循自愿、平等、公平、诚信的原则，遵守法律和商业道德，公平参与市场竞争。

本法所称的不正当竞争行为，是指经营者在生产经营活动中，违反本法规定，扰乱市场竞争秩序，损害其他经营者或者消费者的合法权益的行为。

本法所称的经营者，是指从事商品生产、经营或者提供服务（以下所称商品包括服务）的自然人、法人和非法人组织。

第三条　反不正当竞争工作坚持中国共产党的领导。

国家健全完善反不正当竞争规则制度，加强反不正当竞争执法司法，维护市场竞争秩序，健全统一、开放、竞争、有序的市场体系。

国家建立健全公平竞争审查制度，依法加强公平竞争审查工作，保障各类经营者依法平等使用生产要素、公平参与市场竞争。

第四条　各级人民政府应当采取措施，预防和制止不正当竞争行为，为公平竞争创造良好的环境和条件。

国务院建立健全反不正当竞争工作协调机制，协调处理维护市场竞争秩序的重大问题。
第五条　县级以上人民政府履行市场监督管理职责的部门对不正当竞争行为进行监督检查；法律、行政法规规定由其他部门监督检查的，依照其规定。

第六条　国家鼓励、支持和保护一切组织和个人对不正当竞争行为进行社会监督。

国家机关及其工作人员不得支持、包庇不正当竞争行为。

行业组织应当加强行业自律，引导、规范本行业的经营者依法竞争，维护市场竞争秩序。

第二章　不正当竞争行为

第七条　经营者不得实施下列混淆行为，引人误认为是他人商品或者与他人存在特定联系：

（一）擅自使用与他人有一定影响的商品名称、包装、装潢等相同或者近似的标识；

（二）擅自使用他人有一定影响的名称（包括简称、字号等）、姓名（包括笔名、艺名、网名、译名等）；

（三）擅自使用他人有一定影响的域名主体部分、网站名称、网页、新媒体账号名称、应用程序名称或者图标等；

（四）其他足以引人误认为是他人商品或者与他人存在特定联系的混淆行为。
擅自将他人注册商标、未注册的驰名商标作为企业名称中的字号使用，或者将他人商品名称、企业名称（包括简称、字号等）、注册商标、未注册的驰名商标等设置为搜索关键词，引人误认为是他人商品或者与他人存在特定联系的，属于前款规定的混淆行为。

经营者不得帮助他人实施混淆行为。

第八条　经营者不得采用给予财物或者其他手段贿赂下列单位或者个人，以谋取交易机会或者竞争优势：

（一）交易相对方的工作人员；

（二）受交易相对方委托办理相关事务的单位或者个人；

（三）利用职权或者影响力影响交易的单位或者个人。

前款规定的单位和个人不得收受贿赂。

经营者在交易活动中，可以以明示方式向交易相对方支付折扣，或者向中间人支付佣金。经营者向交易相对方支付折扣、向中间人支付佣金的，应当如实入账。接受折扣、佣金的经营者也应当如实入账。

经营者的工作人员进行贿赂的，应当认定为经营者的行为；但是，经营者有证据证明该工作人员的行为与为经营者谋取交易机会或者竞争优势无关的除外。

第九条　经营者不得对其商品的性能、功能、质量、销售状况、用户评价、曾获荣誉等作虚假或者引人误解的商业宣传，欺骗、误导消费者和其他经营者。
经营者不得通过组织虚假交易、虚假评价等方式，帮助其他经营者进行虚假或者引人误解的商业宣传。

第十条　经营者不得实施下列侵犯商业秘密的行为：

（一）以盗窃、贿赂、欺诈、胁迫、电子侵入或者其他不正当手段获取权利人的商业秘密；

（二）披露、使用或者允许他人使用以前项手段获取的权利人的商业秘密；

（三）违反保密义务或者违反权利人有关保守商业秘密的要求，披露、使用或者允许他人使用其所掌握的商业秘密；

（四）教唆、引诱、帮助他人违反保密义务或者违反权利人有关保守商业秘密的要求，获取、披露、使用或者允许他人使用权利人的商业秘密。

经营者以外的其他自然人、法人和非法人组织实施前款所列违法行为的，视为侵犯商业秘密。

第三人明知或者应知商业秘密权利人的员工、前员工或者其他单位、个人实施本条第一款所列违法行为，仍获取、披露、使用或者允许他人使用该商业秘密的，视为侵犯商业秘密。

本法所称的商业秘密，是指不为公众所知悉、具有商业价值并经权利人采取相应保密措施的技术信息、经营信息等商业信息。

第十一条　经营者进行有奖销售不得存在下列情形：
（一）所设奖的种类、兑奖条件、奖金金额或者奖品等有奖销售信息不明确，影响兑奖；

（二）有奖销售活动开始后，无正当理由变更所设奖的种类、兑奖条件、奖金金额或者奖品等有奖销售信息；

（三）采用谎称有奖或者故意让内定人员中奖等欺骗方式进行有奖销售；

（四）抽奖式的有奖销售，最高奖的金额超过五万元。

第十二条　经营者不得编造、传播或者指使他人编造、传播虚假信息或者误导性信息，损害其他经营者的商业信誉、商品声誉。

第十三条　经营者利用网络从事生产经营活动，应当遵守本法的各项规定。

经营者不得利用数据和算法、技术、平台规则等，通过影响用户选择或者其他方式，实施下列妨碍、破坏其他经营者合法提供的网络产品或者服务正常运行的行为：

（一）未经其他经营者同意，在其合法提供的网络产品或者服务中，插入链接、强制进行目标跳转；

（二）误导、欺骗、强迫用户修改、关闭、卸载其他经营者合法提供的网络产品或者服务；

（三）恶意对其他经营者合法提供的网络产品或者服务实施不兼容；

（四）其他妨碍、破坏其他经营者合法提供的网络产品或者服务正常运行的行为。
经营者不得以欺诈、胁迫、避开或者破坏技术管理措施等不正当方式，获取、使用其他经营者合法持有的数据，损害其他经营者的合法权益，扰乱市场竞争秩序。

经营者不得滥用平台规则，直接或者指使他人对其他经营者实施虚假交易、虚假评价或者恶意退货等行为，损害其他经营者的合法权益，扰乱市场竞争秩序。

第十四条　平台经营者不得强制或者变相强制平台内经营者按照其定价规则，以低于成本的价格销售商品，扰乱市场竞争秩序。

第十五条　大型企业等经营者不得滥用自身资金、技术、交易渠道、行业影响力等方面的优势地位，要求中小企业接受明显不合理的付款期限、方式、条件和违约责任等交易条件，拖欠中小企业的货物、工程、服务等账款。

第三章　对涉嫌不正当竞争行为的调查

第十六条　监督检查部门调查涉嫌不正当竞争行为，可以采取下列措施：

（一）进入涉嫌不正当竞争行为的经营场所进行检查；

（二）询问被调查的经营者、利害关系人及其他有关单位、个人，要求其说明有关情况或者提供与被调查行为有关的其他资料；

（三）查询、复制与涉嫌不正当竞争行为有关的协议、账簿、单据、文件、记录、业务函电和其他资料；
（四）查封、扣押与涉嫌不正当竞争行为有关的财物；

（五）查询涉嫌不正当竞争行为的经营者的银行账户。

采取前款规定的措施，应当向监督检查部门主要负责人书面报告，并经批准。采取前款第四项、第五项规定的措施，应当向设区的市级以上人民政府监督检查部门主要负责人书面报告，并经批准。

监督检查部门调查涉嫌不正当竞争行为，应当遵守《中华人民共和国行政强制法》和其他有关法律、行政法规的规定，并应当依法将查处结果及时向社会公开。

第十七条　监督检查部门调查涉嫌不正当竞争行为，被调查的经营者、利害关系人及其他有关单位、个人应当如实提供有关资料或者情况。

第十八条　经营者涉嫌违反本法规定的，监督检查部门可以对其有关负责人进行约谈，要求其说明情况、提出改进措施。

第十九条　监督检查部门及其工作人员对调查过程中知悉的商业秘密、个人隐私和个人信息依法负有保密义务。

第二十条　对涉嫌不正当竞争行为，任何单位和个人有权向监督检查部门举报，监督检查部门接到举报后应当依法及时处理。
监督检查部门应当向社会公开受理举报的电话、信箱或者电子邮件地址，并为举报人保密。对实名举报并提供相关事实和证据的，监督检查部门应当将处理结果及时告知举报人。

第二十一条　平台经营者应当在平台服务协议和交易规则中明确平台内公平竞争规则，建立不正当竞争举报投诉和纠纷处置机制，引导、规范平台内经营者依法公平竞争；发现平台内经营者实施不正当竞争行为的，应当及时依法采取必要的处置措施，保存有关记录，并按规定向平台经营者住所地县级以上人民政府监督检查部门报告。

第四章　法律责任

第二十二条　经营者违反本法规定，给他人造成损害的，应当依法承担民事责任。

经营者的合法权益受到不正当竞争行为损害的，可以向人民法院提起诉讼。

因不正当竞争行为受到损害的经营者的赔偿数额，按照其因被侵权所受到的实际损失或者侵权人因侵权所获得的利益确定。经营者故意实施侵犯商业秘密行为，情节严重的，可以在按照上述方法确定数额的一倍以上五倍以下确定赔偿数额。赔偿数额还应当包括经营者为制止侵权行为所支付的合理开支。
经营者违反本法第七条、第十条规定，权利人因被侵权所受到的实际损失、侵权人因侵权所获得的利益难以确定的，由人民法院根据侵权行为的情节判决给予权利人五百万元以下的赔偿。

第二十三条　经营者违反本法第七条规定实施混淆行为或者帮助他人实施混淆行为的，由监督检查部门责令停止违法行为，没收违法商品。违法经营额五万元以上的，可以并处违法经营额五倍以下的罚款；没有违法经营额或者违法经营额不足五万元的，可以并处二十五万元以下的罚款；情节严重的，并处吊销营业执照。

销售本法第七条规定的违法商品的，依照前款规定予以处罚；销售者不知道其销售的商品属于违法商品，能证明该商品是自己合法取得并说明提供者的，由监督检查部门责令停止销售，不予行政处罚。

经营者登记的名称违反本法第七条规定的，应当及时办理名称变更登记；名称变更前，由登记机关以统一社会信用代码代替其名称。

第二十四条　有关单位违反本法第八条规定贿赂他人或者收受贿赂的，由监督检查部门没收违法所得，处十万元以上一百万元以下的罚款；情节严重的，处一百万元以上五百万元以下的罚款，可以并处吊销营业执照。
经营者的法定代表人、主要负责人和直接责任人员对实施贿赂负有个人责任，以及有关个人收受贿赂的，由监督检查部门没收违法所得，处一百万元以下的罚款。

第二十五条　经营者违反本法第九条规定对其商品作虚假或者引人误解的商业宣传，或者通过组织虚假交易、虚假评价等方式帮助其他经营者进行虚假或者引人误解的商业宣传的，由监督检查部门责令停止违法行为，处一百万元以下的罚款；情节严重的，处一百万元以上二百万元以下的罚款，可以并处吊销营业执照。

经营者违反本法第九条规定，属于发布虚假广告的，依照《中华人民共和国广告法》的规定处罚。

第二十六条　经营者以及其他自然人、法人和非法人组织违反本法第十条规定侵犯商业秘密的，由监督检查部门责令停止违法行为，没收违法所得，处十万元以上一百万元以下的罚款；情节严重的，处一百万元以上五百万元以下的罚款。

第二十七条　经营者违反本法第十一条规定进行有奖销售的，由监督检查部门责令停止违法行为，处五万元以上五十万元以下的罚款。
第二十八条　经营者违反本法第十二条规定损害其他经营者商业信誉、商品声誉的，由监督检查部门责令停止违法行为、消除影响，处十万元以上一百万元以下的罚款；情节严重的，处一百万元以上五百万元以下的罚款。

第二十九条　经营者违反本法第十三条第二款、第三款、第四款规定利用网络从事不正当竞争的，由监督检查部门责令停止违法行为，处十万元以上一百万元以下的罚款；情节严重的，处一百万元以上五百万元以下的罚款。

第三十条　平台经营者违反本法第十四条规定强制或者变相强制平台内经营者以低于成本的价格销售商品的，由监督检查部门责令停止违法行为，处五万元以上五十万元以下的罚款；情节严重的，处五十万元以上二百万元以下的罚款。

第三十一条　经营者违反本法第十五条规定滥用自身优势地位的，由省级以上人民政府监督检查部门责令限期改正，逾期不改正的，处一百万元以下的罚款；情节严重的，处一百万元以上五百万元以下的罚款。

第三十二条　经营者违反本法规定从事不正当竞争，有主动消除或者减轻违法行为危害后果等法定情形的，依法从轻或者减轻行政处罚；违法行为轻微并及时纠正，没有造成危害后果的，不予行政处罚。
第三十三条　经营者违反本法规定从事不正当竞争，受到行政处罚的，由监督检查部门记入信用记录，并依照有关法律、行政法规的规定予以公示。

第三十四条　经营者违反本法规定，应当承担民事责任、行政责任和刑事责任，其财产不足以支付的，优先用于承担民事责任。

第三十五条　妨害监督检查部门依照本法履行职责，拒绝、阻碍调查的，由监督检查部门责令改正，对个人可以处一万元以下的罚款，对单位可以处十万元以下的罚款。

第三十六条　当事人对监督检查部门作出的决定不服的，可以依法申请行政复议或者提起行政诉讼。

第三十七条　监督检查部门的工作人员滥用职权、玩忽职守、徇私舞弊或者泄露调查过程中知悉的商业秘密、个人隐私或者个人信息的，依法给予处分。

第三十八条　违反本法规定，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。

第三十九条　在侵犯商业秘密的民事审判程序中，商业秘密权利人提供初步证据，证明其已经对所主张的商业秘密采取保密措施，且合理表明商业秘密被侵犯，涉嫌侵权人应当证明权利人所主张的商业秘密不属于本法规定的商业秘密。
商业秘密权利人提供初步证据合理表明商业秘密被侵犯，且提供以下证据之一的，涉嫌侵权人应当证明其不存在侵犯商业秘密的行为：

（一）有证据表明涉嫌侵权人有渠道或者机会获取商业秘密，且其使用的信息与该商业秘密实质上相同；

（二）有证据表明商业秘密已经被涉嫌侵权人披露、使用或者有被披露、使用的风险；

（三）有其他证据表明商业秘密被涉嫌侵权人侵犯。

第五章　附　　则

第四十条　在中华人民共和国境外实施本法规定的不正当竞争行为，扰乱境内市场竞争秩序，损害境内经营者或者消费者的合法权益的，依照本法以及有关法律的规定处理。

2025年1月8日

公共数据资源登记管理暂行办法

第一章 总\xA0 则
　　第一条\xA0 为促进公共数据资源合规高效开发利用，构建全国一体化公共数据资源登记体系，规范公共数据资源登记工作，根据《中华人民共和国网络安全法》《中华人民共和国数据安全法》《中华人民共和国个人信息保护法》等法律法规，按照《中共中央、国务院关于构建数据基础制度更好发挥数据要素作用的意见》《中共中央办公厅、国务院办公厅关于加快公共数据资源开发利用的意见》要求，制定本办法。
　　第二条\xA0 在中华人民共和国境内开展公共数据资源的登记活动及其监督管理，适用本办法。
　　第三条\xA0 本办法中的术语含义：
　　（一）公共数据资源，是指各级党政机关、企事业单位依法履职或提供公共服务过程中产生的具有利用价值的数据集合。
　　（二）登记主体，是指根据工作职责直接持有或管理公共数据资源的单位，以及依法依规对授权范围的公共数据资源进行开发运营的法人组织。
　　（三）登记机构，是指由国家和地方数据管理部门设立或指定的、提供公共数据资源登记服务的事业单位。
　　（四）登记平台，是指支撑公共数据资源登记全流程服务管理的信息化系统。
　　第四条\xA0 公共数据资源登记应当维护国家安全和公共利益，保护国家秘密、商业秘密、个人隐私和个人信息权益，遵循依法合规、公开透明、标准规范、安全高效的原则。
第二章 登记要求
　　第五条\xA0 直接持有或管理公共数据资源的党政机关和事业单位，应对纳入授权运营范围的公共数据资源进行登记，鼓励对未纳入授权运营范围的公共数据资源进行登记。
　　鼓励经授权开展运营活动的法人组织，对利用被授权的公共数据资源加工形成的数据产品和服务进行登记。鼓励供水、供气、供热、供电、公共交通等公用企业对直接持有或管理的公共数据资源及形成的产品和服务进行登记。
　　第六条\xA0 登记机构负责实施公共数据资源登记，执行全国统一的登记管理要求，按照行政层级和属地原则提供规范化、标准化、便利化登记服务。
　　登记机构应建立健全数据资源登记管理责任机制，履行数据安全保护义务，强化数据安全保护技术应用，妥善保管登记信息。
　　中央和国家机关及其直属机构、中央企业的公共数据资源登记，由国家数据局指定所属事业单位负责办理。
　　第七条\xA0 登记主体经业务审核后，通过登记平台提出登记申请，如实准确提供登记材料，并对登记材料内容的真实性、完整性、合法性、有效性负责。涉及多个主体的，可共同提出登记申请或协商一致后由单独主体提出登记申请。
　　登记主体在申请登记前应在保障安全的前提下对公共数据资源进行存证，确保来源可查、加工可控。
第三章 登记程序
　　第八条\xA0 公共数据资源登记应按照申请、受理、形式审核、公示、赋码等程序开展。
　　第九条\xA0 公共数据资源登记申请类型主要包括首次登记、变更登记、更正登记、注销登记。
　　（一）首次登记：登记主体应按规定提交主体信息、数据合法合规性来源、数据资源情况、存证情况、产品和服务信息、应用场景信息、数据安全风险评估等申请材料。登记主体在开展授权运营活动并提供数据资源或交付数据产品和服务后，在20个工作日内提交首次登记申请。本办法施行前已开展授权运营的，登记主体应按首次登记程序于本办法施行后的30个工作日内进行登记。
　　（二）变更登记：对于涉及数据来源、数据资源情况、产品和服务、存证情况等发生重要更新或重大变化的，或者登记主体信息发生重大变化的，登记主体应及时向登记机构申请变更登记。
　　（三）更正登记：登记主体、利害关系人认为已登记信息有误的，可以申请更正登记。经登记主体书面同意或有证据证明登记信息确有错误的，登记机构对有关错误信息予以更正。
　　（四）注销登记：有下列情形之一的，登记主体应申请办理注销登记，登记机构自受理之日起10个工作日之内完成注销。
　　1.公共数据资源不可复原或灭失的；
　　2.登记主体放弃相关权益或权益期限届满的；
　　3.登记主体因解散、被依法撤销、被宣告破产或因其他原因终止存续的；
　　4.法律法规规定的其他情形。
　　第十条\xA0 登记机构应当自收到申请日起，3个工作日内予以受理。申请材料不齐全或者不符合规定的，需一次性告知登记主体补充完善，并按新补充后重新提交申请之日起计算受理日期。不予受理的，应当向登记主体及时说明理由。
　　第十一条\xA0 登记机构应当对登记材料内容进行形式审核，自受理之日起20个工作日之内完成审核。审核未完成的，应当向登记主体说明原因。
　　第十二条\xA0 登记机构形式审核完成后应当将有关登记信息通过登记平台向社会公示，公示期为10个工作日。登记公示内容主要包括登记主体名称、登记类型、登记数据名称、数据内容简介。
　　公示期内对公示信息有异议的，相关当事人应实名提出异议并提供必要证据材料，登记机构应当对提出的异议进行复核，异议成立的，应终止登记。
　　第十三条\xA0 公示期满无异议的，登记机构应按照国家数据局制定的统一编码规范向登记主体发放登记结果查询码。
第四章 登记管理

　　第十四条\xA0 国家数据局加强公共数据资源登记管理，推进登记服务标准化，依托登记信息和政务数据目录，建立健全公共数据资源目录。建设国家公共数据资源登记平台，实现与各省级公共数据资源登记平台对接，推动登记信息互联互通。在全国范围内实现登记结果统一赋码，支撑登记信息的查询和共享。
　　省级数据管理部门应加强集约化建设，统筹开展本辖区公共数据资源登记平台使用管理工作，强化数据共享、应用服务和安全保障。
　　第十五条\xA0 登记结果有效期原则上为三年，自赋码之日起计算。对授权运营范围内的公共数据产品和服务登记，根据授权协议运营期限不超过三年的，登记结果有效期以实际运营期限为准。
　　登记结果有效期届满的，登记主体可在期满前60日内按照规定续展。每次续展期最长为三年，自上一届有效期满次日起计算。期满未按规定续展的，由登记机构予以注销。
　　第十六条\xA0 登记机构应按照全国统一的登记要求，优化服务流程，提升登记便利化服务水平。
　　第十七条\xA0 国家数据局统筹开展公共数据资源登记标准体系和登记工作评价机制建设。省级数据管理部门统筹开展对本辖区登记机构的服务水平评价。

第五章 监督管理
　　第十八条\xA0 全国公共数据资源登记工作实行分级监督管理。国家数据局主管全国公共数据资源登记工作。省级数据管理部门统筹负责本辖区的公共数据资源登记工作。各级数据管理部门应会同有关部门做好跨部门的协同监管。
　　第十九条\xA0 登记机构在登记过程中有下列行为的，由数据管理部门采取约谈、现场指导或取消登记机构资格等管理措施：
　　（一）开展虚假登记；
　　（二）擅自篡改、伪造登记结果；
　　（三）私自泄露登记信息或利用登记信息不当获利；
　　（四）履职不当或拒不履职的情况；
　　（五）其他违反法律法规的情况。
　　第二十条\xA0 登记主体有下列行为的，经核实认定后由登记机构撤销登记：
　　（一）隐瞒事实、弄虚作假或提供虚假登记材料；
　　（二）擅自篡改、伪造登记结果；
　　（三）非法使用或利用登记结果不当获利；
　　（四）其他违反法律法规的情况。
　　第二十一条\xA0 登记机构、登记主体存在违反有关法律行为的，依法承担相关责任；构成犯罪的，依法追究刑事责任。

第六章 附\xA0 则
　　第二十二条\xA0 各省（自治区、直辖市）数据管理部门可依照本办法制定实施细则。
　　第二十三条\xA0 本办法由国家数据局负责解释。
